description: 住在 DSH 里的 AI 搭子：独立聊天列表、私信式气泡和连续发送；同一角色共享近期对话与可检索历史，新建聊天也能接话。可以用一句话创建、改期和取消提醒，把明确委托交给后台的 DSH Agent 执行并带回结果，还能改称呼、表达方式和双方气泡颜色；多个角色各自保存聊天与记忆。
