description: 透明鲸鱼桌宠住在界面右下角：待机呼吸、随机小动作、点击回应，能拖到四个角并记住位置。双击打开对话面板，可设名字、称呼、自称和人设正文，对话记忆重启不丢；它还会按间隔自己出门上网，从来源清单抓取内容后用设定的口吻讲给你听，并保留来源链接。
