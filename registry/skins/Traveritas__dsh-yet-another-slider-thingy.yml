id: traveritas.dsh.yet.another.slider.thingy
name:
  zh: 思考强度滑条
  en: Reasoning Effort Slider
author: Traveritas
description: 把 composer 的模型位换成「模型行 + 思考强度滑条」：档位、分组与提交路径仍走原生模型目录。滑条有三种外观（紧凑 / 块面 / 胶囊）、拇指可切圆角方或圆、标准或大两档，配色可增删预设，另有流光场、密度粒子、心跳、字符点阵、渐变五套跟档位的特效，拖动可切逐档或平滑。
