description: 右下角常驻一只皮卡丘，跟着会话状态换动作：运行中奔跑跳跃、脸颊冒电火花，等确认时举手跳并顶「！」，一轮完成欢呼洒星光，空闲 90 秒换睡姿趴下。点击会叫，8 张姿势与 3 段叫声从候选里随机、避免连续重复；悬停右上角可静音，声音开关也在设置→通用里，偏好存 localStorage，不联网无遥测。
