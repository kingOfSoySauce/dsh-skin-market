id: nizihan29.dsh.theme.strinova
name:
  zh: 卡拉彼丘主题
  en: Strinova Theme
author: nizihan29
description: 暖琥珀金的卡拉彼丘配色，浅色和深色两套；角色卡随机轮换，卡面带一句台词和右下角 Q 版表情包，界面背景飘浮粒子，侧栏 logo 可换自定义图片。主题通过一份 client 注册，不写死档位，profile 里把 config.enabled 改成 false 就能暂时停掉样式注入、保留插件。内置图片来自卡拉彼丘 Wiki，版权归官方。
