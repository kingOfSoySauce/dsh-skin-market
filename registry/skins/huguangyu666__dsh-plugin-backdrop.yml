id: huguangyu666.dsh.plugin.backdrop
name:
  zh: 流体鲸背景
  en: Fluid Whale Backdrop
author: huguangyu666
description: 把官方站点 hero 的深海氛围铺成整页动态背景：WebGL2 流体（flowmap 双缓冲 + 域扭曲）铺 5 层深蓝到暖金渐变，自发光与虚拟光源跟随鼠标、叠颗粒噪点与暗角，210 帧字符鲸鱼水平巡游并在循环接缝打一个赛博朋克故障转场，55 条发光鱼群绕圈游动，再加 90px 点线网格，鼠标波纹能把点阵推开。界面容器透明化并强制暗色，四层 30fps 节流、视口外停帧。
