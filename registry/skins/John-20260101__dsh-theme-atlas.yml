description: 六套材质皮肤共用一个配色引擎：墨玉、赤陶、极光、深海、樱雾、素笺，每套声明 6 个输入色，推导出界面读取的 119 个 token 并做对比度实测（正文 14.9:1 起）。右下角 Atlas 胶囊或 Alt+K 切换，纯 CSS 无图片、不注册路由，也不覆盖你的明暗偏好。
