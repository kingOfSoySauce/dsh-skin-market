description: 把 .css 扔进 ~/.dsh/themes 就能列入「设置 → 主题与背景」（内置 Atom One Dark、Monokai Pro、Gov、Claude 预设，实时扫描热加载），还可给整体、标题栏、侧栏、会话区、对话框、工具面板 6 个分区分别铺壁纸并调透明度与 0–20px 模糊；另有星空 / 深海推理档位滑条、正文行距、流式渐显、思考文案轮播与 26 周用量热力图。
