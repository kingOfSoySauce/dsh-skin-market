id: kongchengavg.dsh.pet.statuslight
name:
  zh: 角色状态灯
  en: Character Status Light
author: kongchengavg
description: 角色表情状态灯：九位角色（芙宁娜、胡桃、空、纳西妲、枫原万叶、荧、钟离、红绿灯、机器人）随任务在思考、报错、完成与空闲四态间切换表情，右键随时换角色并记住选择；任务完成、出错或向你提问时弹角色气泡，可点「查看详情」跳到对应会话。Windows 下另有独立于浏览器的透明置顶小窗，浏览器最小化也可见。
