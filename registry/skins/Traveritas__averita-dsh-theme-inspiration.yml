description: 四套主题（昼雾 · 靛夜、冷晨、暮玫瑰、暮紫）× 浅 / 深各一套，每套 205 个令牌；背景二选一：点阵（圆点 / 方块 / 字符 / 字符墙，缩放 0.5–4×、浓淡 30–400% 与动效呼吸可调）或 WebGL 流光场（默认跟随主题取色，另有四套固定色板、明暗可反转）。另有可改字标的品牌位、新会话星标首屏、纸品 / 星芒装饰与四个区域总开关，全部在「设置 → 主题」即时切换。
