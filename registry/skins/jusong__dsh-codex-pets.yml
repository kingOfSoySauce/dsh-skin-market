description: 一只小鲸鱼浮在 macOS 桌面所有窗口之上：点它把主窗口带到前台，拖着换位置，闲置时自己演小动作，系统开了「减少动态」就只显示静态帧。设置里能换宠物、调 80–260px 大小，另有最近会话球、右键新会话输入框和 Command+Option+N 快捷键。
