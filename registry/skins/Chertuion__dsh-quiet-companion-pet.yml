id: chertuion.dsh.quiet.companion.pet
name:
  zh: 安静陪伴
  en: Quiet Companion
author: Chertuion
description: macOS 桌面上的 Q 版橙发伙伴：双击文字聊天，摸头、轻戳、碰裙摆也会触发回应；开启观察后，它会结合前台应用、画面与视频对白挑时机开口，也能保持安静。默认模型生成对白，另有记忆、真实任务进度与随时间积累的虚拟零食；24 类动作共 192 帧，本机朗读时嘴型跟随实际音量，仅 Apple Silicon Mac、macOS 14 以上。
