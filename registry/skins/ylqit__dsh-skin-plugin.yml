id: ylqit.dsh.skin.plugin
name:
  zh: 声明式换肤工作室
  en: Declarative Skin Studio
author: ylqit
description: 声明式换肤插件：只接受 .dshskin schema v4，v1–v3 直接拒绝；主题只能改受控 token、背景、组件表面图、装饰图标与固定模板，禁止 JS、HTML、任意 CSS、外链与布局改动。内置杰尼龟水舱、妙蛙种子生长舱与皮卡丘电能三套；工作室提供真实界面导览图、点击定位、明暗缩略图、拖放替换与试穿。
