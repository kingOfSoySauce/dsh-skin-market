id: verayi2007.dsh.dafeiyu.splash
name:
  zh: 大肥鱼启动动画
  en: Bigfish Splash
author: Verayi2007
description: 启动时的一段五拍片头：大肥鱼娘先从屏幕底边探头，看清是你后一下冲到面前占满整屏，再退回舞台缩回原大小，冲你挥手说「嗨～」，2.9 秒字标落款、3.05 秒一道高光扫过，4.6 秒收幕。整段 5 秒由一条关键帧镜头驱动，点击、按键或滚轮随时跳过，跟随系统减少动态效果。
