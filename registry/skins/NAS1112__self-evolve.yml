id: nas1112.self.evolve
name:
  zh: 自我进化
  en: Self-Evolve
author: NAS1112
description: 任务完整结束后自动复盘一次：把值得记的经验写进工作区或全局 AGENTS.md 与 ~/.agents/skills，默认只在确有失败或走通复杂流程时写、一次最多一条，不打断对话流。右下角桌宠用状态动画播报进化次数，点开是经验库：记忆、技能提案（看 diff 再应用）、决策统计与批量清空；模型侧提供 record / propose / status 三个工具。
