description: 把《原神》尼可角色 PV 里的画面铺成背景：14 张去字幕截图按顺序轮换，每次两秒淡入淡出，没有声音也不播放视频。右下角可暂停、继续或手动前后切图，间隔能设 1/5/10/30/60 分钟，默认 1 分钟；切到别的标签页和系统开「减少动态」时会暂停。
