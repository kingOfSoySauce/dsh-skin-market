name:
  zh: 超新星启动动画
  en: Supernova Boot Splash
author: wk-single
description: 打开页面先满屏播放约 3.6 秒超新星序列：170–380 条拖尾光线向中心汇聚，核心白热过载，爆闪后 430 块碎片与冲击波散开，DEEPSEEK/HARNESS 字标砸出，再拉伸成超空间光线淡出。四角 HUD 显示时间码、节点哈希与版本号，点击或按 Esc 可跳过。
