id: awahara.dsh.plugin.boot.splash
name:
  zh: HUD 启动序列
  en: HUD Boot Sequence
author: Awahara
description: 应用挂载完成后在界面上播一段约 3.8 秒的 HUD 引导序列：深空渐变、缓慢漂移的网格与透视地板、三组反向旋转的刻度环、进度弧、自绘六边形和鲸标，HARNESS 字标逐字揭示，左下角滚动 ok/linked/online 启动日志；点击或 Esc、空格、回车可跳过，每个标签页只播一次，系统减少动态效果时缩短到约 1.4 秒。
