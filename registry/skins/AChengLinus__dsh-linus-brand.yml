description: "把自己的插画角色装进界面：侧栏左上角的品牌标记换成 Linus 头像 + 名字，输入框上沿的默认吉祥物也换成同一角色，18 个状态各有 24–72 帧连续动作、约 19fps 并带像素粒子，状态切换用 280ms 淡入上移过渡。它不改皮肤文件，而是依赖 dsh-claude-style 皮肤的 brandName / mascot: deepy 机制注入，关掉即回原样。"
