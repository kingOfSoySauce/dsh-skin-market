description: 整页驾驶舱主题：任务屏、AI 核心屏与中央主屏沿用宿主原生节点，舱外是连续深空星景，舱体可转头、拉近拉远。右下角飞行控制用 0–100% 速度滑条驱动巡航与跃迁（极快时出蓝色跃迁通道和长光束），随机航向与随机跃迁随航速自动生效；短按「抬头观景」把视线转向高舷窗，三屏可各自悬浮拖动。
