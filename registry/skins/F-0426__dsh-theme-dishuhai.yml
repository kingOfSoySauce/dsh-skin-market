description: "双模式主题：深色是终末地工业风，近黑底 #0d0d0c 配信号黄 #ffef00、等高线地形纹理与 88px 网格、三段色工业条；浅色照官网配色做白蓝卡片、呼吸网格和 14px 大圆角气泡。启动页也跟着切：深色「抵数海」错落字标配黄条进度与黄块扫屏，浅色 2600 个粒子汇聚成白鲸再眨一下眼。"
