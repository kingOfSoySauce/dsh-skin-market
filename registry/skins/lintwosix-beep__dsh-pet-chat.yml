description: 基于 dsh-pet（MIT）的二创桌宠：动画、素材与桌面窗口全部保留，另加 QQ 风格对话面板——气泡＋头像＋日期分隔，可在对话记录、收藏与分支之间切换；分支聊完点「合并到主对话」会以合并转发卡片落进记录，面板停靠在小女仆右侧并支持八向缩放。寒暄走本地规则表不花 token，真问题才发给模型。
