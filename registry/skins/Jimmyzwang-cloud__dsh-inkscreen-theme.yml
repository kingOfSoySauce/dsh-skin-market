description: 把 DSH 网页端改成墨纸配色的浅色界面：暖奶油与墨色、磨砂玻璃面板、楷体感的会话正文与等宽代码。聊天上方新增最近会话页签栏，用状态点区分运行、等待、完成与空闲；会话/追踪切换收进同一行做成分段控件，侧栏品牌换成手写「jimmy」与小狗头像。
