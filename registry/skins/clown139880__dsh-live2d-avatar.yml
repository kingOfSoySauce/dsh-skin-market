description: 对话、轨迹、形象三个视图，其中形象视图是一块 Live2D 舞台：内置 Haru 示例模型开箱即用，也能导入自己的 Cubism 2/3+ 模型并设置模型目录、缩放和位置；普通 Web 里是页面内可拖动的桌宠，Desktop 可开透明、无边框、置顶的独立窗口。表情控制 prompt 与 ASR/TTS 默认关闭，按对话授权或自行配置服务。
