id: ssamurias.dsh.fish
name:
  zh: 养成大肥鱼
  en: Bigfish Raising
author: ssamurias
description: 养一条会自己长大的鱼：没有人格设置菜单，默认从空白养起，靠事件流积累记忆、判断与拒绝，走完信任→自主→主动→整合四个阶段后才开始形成立场（清单最多 12 条，写进身份的 8 条）。她会自己刷 B 站、看评论、写日记，登录 cookie 只存本机 ~/.dsh-fish/owner.json（权限 0600），状态库不能删除记录。
