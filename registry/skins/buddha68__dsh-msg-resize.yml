id: buddha68.dsh.msg.resize
name:
  zh: 对话浮窗
  en: Floating Chat Pane
author: buddha68
description: 把对话区（消息列加输入框）变成可拖动的浮窗：拖右下角把手改宽高，最小 460×320；拖右上角把手搬位置；双击复位，聚焦把手后方向键微调。位置和尺寸存在 localStorage，刷新、重开都保留，活动范围限制在对话内容窗格内。
