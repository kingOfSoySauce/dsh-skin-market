description: 「流萤」原创形象的启动动画与夜航主题：载入时播放线条起笔、上色到睁眼的动画，结束后工作台背景保留同一个人像（呼吸、约 20 秒眨眼、虹膜跟随鼠标），另加环境萤火与右下角 40px 重播按钮；启用期间强制深色，卸载后恢复原主题。
