description: 三张乐山照片做成的主题包：三江夜、凌云晚照、峨眉夜雾各以一张原尺寸照片铺满页面，每套只声明六个输入色，引擎推导出 119 个别名令牌，三套 × 明暗共六组配色，正文对比度 15.4–16.5:1。右下角乐山胶囊或 Alt+K 循环切换，选择存在浏览器本地；照片经精确白名单只读路由分发，无服务时退回纯色仍可用。
