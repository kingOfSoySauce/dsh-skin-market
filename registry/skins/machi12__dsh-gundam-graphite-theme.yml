  zh: 高达 · 石墨
  en: Gundam Graphite
author: machi12
description: 内置 1672×941 黑灰机甲壁纸，侧栏、输入卡和弹窗统一成石墨玻璃面板，背景里流动银灰粒子，还有一层被鼠标推开又回弹的弹性网格。16 项实时设置：壁纸遮罩与虚化、面板不透明度、粒子亮度、数量、速度、网格五种模式、视差、帧率上限；关掉开关即回原生外观。
