description: 常驻侧边栏底部的迷你播放器：搜歌可切 QQ 音乐、网易云与酷狗，带发现广场、播放队列和与站点网页端双向同步的「我喜欢」，音质分 320k、无损与站点最高三档。音频与登录态都经本机 Host 转发，页面只拿到不透明本地地址，拖动进度条也正常。
