id: nefelibater.dsh.theme.prts.originium
name:
  zh: PRTS · 源石协议
  en: PRTS · Originium Protocol
author: Nefelibater
description: 冷峻工业风的双面主题：浅色是冷灰青纸面档案、深色是冷墨蓝终端，两者都配琥珀金定位线。欢迎页有可拖动旋转的 3D 源石晶簇（224 块晶体、8134 个三角面）与测绘网格；侧栏角落的「P/01」收起普瑞赛斯三张记忆影像。启动动画约 3.3 秒，可跳过、重播或关闭，另有专注阅读模式收起装饰。
