description: "- 在 设置 → 通用 → 网页背景 中切换：无、纯色、图片。 - 纯色模式支持颜色选择器。 - 图片模式使用本地上传图片（自动压缩为 data URL）。 - 支持 0–100% 背景不透明度。 - 支持一键恢复默认背景。 - 设置保存在浏览器 localStorage，刷新后自动恢复。 - 多个标签页之间自动同步背景设置。"
