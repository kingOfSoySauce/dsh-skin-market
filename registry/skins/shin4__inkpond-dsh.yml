id: shin4.inkpond.dsh
name:
  zh: 墨池
  en: Inkpond
author: shin4
description: 铺在会话界面上的可交互汉字水墨背景：默认「大肥鲸」在汉字海浪里游动，会游向饭碗吃饭、喷米并响应指针；另有莲池、山水、清明上河、二十四节气和北冥可选。跟随明暗主题，默认只在新会话显示、浓度 45%，标签页隐藏时暂停，减少动态或弱设备自动降到静态 / 低档。
