description: 把工作台换成粉色 Hello Kitty 主题：浅色版用奶油白、贝壳粉和玫瑰粉，深色版用深莓果色；会话头换字标，输入框加蝴蝶结和兔子杯，侧栏放坐姿 Kitty，对话区铺菱格、爱心和星星纹样。附带提醒插件：一轮对话结束或模型以提问收尾时弹卡片提醒，页面切走则发系统通知。
