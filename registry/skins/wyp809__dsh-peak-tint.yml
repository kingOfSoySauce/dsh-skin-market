description: 按 API 计费时段给界面染色：高峰时段转暖色、空闲时段转冷绿，时段表可按星期与起止时间编，支持跨夜、按北京时间解释，配色也能改。六套内置配色、四支取色器、渐变角度与强度、15–100% 不透明度；覆盖范围分贴边、全屏、关闭三档，点输入框左侧胶囊循环切换，检测到壁纸插件会自动降级。
