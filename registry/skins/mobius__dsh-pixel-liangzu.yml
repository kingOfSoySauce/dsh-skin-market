description: 像素大头桌宠：6 档性能滑杆各配一套角色，从瘦白领、清秀西装、型男西装、中山装、怒目武者到冕冠帝王，共 30 张两帧循环 GIF；动作跟随会话快照——运行中工作、等待审批或提问时招手、完成后庆祝约 3.6 秒、无会话休息，其余待机。宠物上显示 Lv.N 徽章、状态胶囊与切换气泡，可拖到任意位置并记住，点击看详情。
