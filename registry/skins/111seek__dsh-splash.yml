id: 111seek.dsh.splash
name:
  zh: 反应堆启动动画
  en: Arc Reactor Splash
author: 111seek
description: 约 9.2 秒的启动动画：反应堆三次能量跳变后核心点燃，外圈 / 内圈加速旋转、HUD 环与左右两栏面板滑出，数据队列滚动、频谱跳动，`DEEPSEEK HARNESS` 由乱码逐字解码、进度条走满，最后白光一闪进主界面；内置一段 5 秒问候语音（base64 内嵌，可换），Esc 或点击即可跳过。整包约 110KB，一个内联 SVG + 纯 CSS 关键帧，运行时无图片、无字体、无依赖、不联网；`prefers-reduced-motion` 下直接给静止的已启动画面。
