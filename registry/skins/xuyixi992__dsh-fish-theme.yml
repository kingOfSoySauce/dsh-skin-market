id: xuyixi992.dsh.fish.theme
name:
  zh: 鲸鱼娘双层水印
  en: Whale Girl Watermarks
author: xuyixi992
description: 五套定制配色（青蓝、素白、靛紫、墨青、终端），每套都成对定义浅色与深色；界面叠两层独立水印——固定的女仆立绘与 21 张可切换表情图，浓淡可调。终端配色下代码块是纯黑面板、金琥珀关键字，并重着色 9 类语法标记，取自 Windows Terminal 的 Campbell 配色。
