description: 九套复古印刷配色，每套以一件实物命名——鼠尾草、牛皮纸、铅字、蓝晒纸、孔版、显像管、荧光屏、打孔卡、软盘——并各自决定中英文字体配对、纸纹或扫描线、压印强度与段落线。设置里还能调版心宽度（600/720/满宽）、圆角、线条、密度与深色磷光，13 种拉丁字面随包内嵌，汉字底线是 4239 字的思源宋体子集。
