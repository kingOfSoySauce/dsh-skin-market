description: 黑白 e-ink 阅读风主题：浅色白底墨字、深色黑底浅字跟随原生明暗；侧栏条目默认无框，悬浮与选中时文字、图标和时间一起反色，细线分隔面板；正文使用本机已装的霞鹜文楷（未装则回退系统字体）。Markdown 六级标题保留红橙黄绿蓝紫，代码差异配色也保留，原生字号与键盘焦点不变。
