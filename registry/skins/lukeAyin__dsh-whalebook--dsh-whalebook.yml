id: lukeayin.dsh.whalebook
name:
  zh: 鲸事本
  en: Whalebook
author: lukeAyin
description: 住在界面里的桌宠「小鲸记」：点一下就在旁边弹出待办清单，能记一条、勾完成、行内改正文与到期时间，到期越近提醒越密（7 天内从每 24 小时逐级加密到每 5 分钟）。另有百余个透明动画、屏幕漫游、点击 Q 弹与甩抛反弹、余额/工作状态联动，还能开成桌面透明小窗、支持多开与自定义宠物种类。
