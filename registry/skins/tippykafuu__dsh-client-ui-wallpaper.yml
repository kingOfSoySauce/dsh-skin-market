id: tippykafuu.dsh.client.ui.wallpaper
name:
  zh: 角落壁纸
  en: Corner Wallpaper
author: tippykafuu
description: 把一张壁纸固定在界面右下角、压在控件后面，三个 CSS 变量管构图：尺寸默认 auto min(78vh,58vw)，贴哪个角默认 right 2.5vw bottom -1vh，以及盖在图上让文字清楚的底色浓度（浅色 62%、深色 70%）。侧栏刻意保留实心底，其余容器按需透明；换图要跑 node build-client.mjs <图片路径> 把图片内联进 bundle 后刷新。
