id: holoen.gwargura.dsh.bigfish.blur
name:
  zh: 大肥鱼窗口模糊
  en: Big Fish Window Blur
author: HoloEN-Gwargura
description: 把整个窗口做成液态玻璃：读取当前桌面壁纸、模糊 46px 后作为画布，侧栏 20%、聊天面板 26% 白玻璃，卡片 40–68%，菜单与弹层 92–97% 加 48px 模糊；容器透、内容实，代码块和文档预览单独加背景模糊，保证正文与菜单可读，开启「减少透明」时自动退回纯色。
