id: hub.spec.dsh.composer.effort.slider
name:
  zh: 推理等级滑杆
  en: Reasoning Effort Slider
author: Hub-spec
description: 输入框工具行里的推理等级滑杆：点开胶囊拖到 Off / Low / High / Max，松手写回当前会话，改动对下一个请求生效。档位读自模型的 reasoning.efforts 元数据，模型没有该元数据时整个控件隐藏；齿轮里可选五种填充特效（原页面、音频条、极光、格子、超空间）、胶囊或通栏填充与六种拖尾，亮暗配色跟随界面。
