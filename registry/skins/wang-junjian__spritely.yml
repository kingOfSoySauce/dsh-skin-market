id: wang.junjian.spritely
name:
  zh: Spritely 精灵
  en: Spritely
author: wang-junjian
description: 界面角落放一只会动的小精灵，随工作状态切姿态：待命、思考、撰写、调用工具、等你确认、出错，运行收尾时会庆祝一下；眼珠跟着鼠标，可拖到任意位置一键归位。四款角色（蓝球、薄荷机器人、猫咪、幽灵）可切换，背景支持纯色、渐变、图片 URL 与本地上传；在消息里划词会弹出复制、朗读、提问工具条。
