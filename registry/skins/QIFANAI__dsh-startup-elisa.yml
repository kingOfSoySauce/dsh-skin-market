description: 7.2 秒冷启动序列（默认 80% 速度、实际约 9 秒）：黑幕开幕 → HUD 逐项锁定 PROFILE / MODEL / BUNDLES / SANDBOX / SESSIONS → 粒子光扫 → 幕布合拢成绯红光缝 → 主界面通电显影，配程序化合成的 7.8 秒音轨与 1.35 秒提示音；另有 off / accent / full / glass 四档皮肤，默认 glass 含 11 层呼吸背景、aurora / deepsea / violet 三套主题和输入框整圈流动光边框。公开仓库不含第三方人物素材，缺失时按降级链继续。
