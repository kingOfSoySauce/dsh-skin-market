id: keithtmaxwell.dsh.skin.deepsea.tui
name:
  zh: 深海终端
  en: Deepsea Terminal
author: KeithTMaxwell
description: 深海终端：蓝色终端框线、消息卡片与代码块；空白会话显示大肥鱼角色欢迎画面，会话状态（思考、工具执行、输出、等待确认）用竖条脉冲提示，底部显示 DSH 进程 CPU 占用。欢迎图、访客来访、底部状态栏、纹理暗角、动效与大肥鱼人设都能单独开关，需配合皮肤管理器使用。
