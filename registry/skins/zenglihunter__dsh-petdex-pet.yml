description: 把 Petdex 的像素宠物搬到右下角：跟随工具调用、任务完成、等待批准等状态切换九种精灵动画，可拖动、悬停互动，同一状态持续 5 秒后自动隐藏。自带小杰、奇犽、酷拉皮卡、雷欧力四个猎人宠物包，设置页能调大小、切换删除、搜图库，也能粘贴安装代码一键装新宠物。
