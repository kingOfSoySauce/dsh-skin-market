description: 手绘像素小鲸鱼常驻会话标题栏：空闲时约 5 秒眨一次眼、约 11 秒摆一次尾巴，连续空闲 10 秒睡着并冒「Z」，思考/运行中尾巴与胸鳍持续动，回合完成头顶喷水庆祝，点击冒一颗粉色爱心；22 帧像素画、7 色调色板，零核心改动也不进入模型请求。
