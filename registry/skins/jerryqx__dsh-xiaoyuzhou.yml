description: 在会话输入框下方加一条播客播放条，点开面板可粘贴小宇宙分享链接直接播放，免登录。面板支持订阅、shownotes 阅读、断点续播（超过 30 秒才记忆）、0.75–2 倍速与音量；扫码登录后能搜索节目、同步订阅并看到更早的单集。还注册 podcast_play 工具，让模型直接帮你播放某一期。
