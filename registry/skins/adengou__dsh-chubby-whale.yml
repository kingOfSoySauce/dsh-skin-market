description: 常驻页面右下角的蓝发鲸鱼娘：可拖拽带惯性并记住位置、会眨眼，点了能聊（人设固定、中英双语、长期记忆摘要），还能喂食、成长与亲密度；自带 9 种音色的语音合成与语音聊天、17 本古籍说书、737 首诗、261 个典故、834 条成语、696 个民间故事与 51 副对联，11 首曲子用 Web Audio 合成，并附一个手机简版页面。聊天需自备 DeepSeek Key，没有 Key 时离线部分照常可用。
