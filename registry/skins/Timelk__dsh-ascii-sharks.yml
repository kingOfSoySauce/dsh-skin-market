id: timelk.dsh.ascii.sharks
name:
  zh: ASCII 鲨鱼
  en: ASCII Sharks
author: Timelk
description: 整页透明的 ASCII 海洋：boid 鱼群在页面框架后 flocking、鲨鱼巡游追猎，点击任意处炸水花，世界是环面（游出一侧从另一侧回来），浅色主题用深墨、深色主题用浅墨并实时切换；对话主栏覆盖一层四边羽化的毛玻璃，字符尺寸 4–14px、8 种鲨鱼、鱼群密度与模糊都可调。减少动态时自动静帧，页面不可见时暂停。
