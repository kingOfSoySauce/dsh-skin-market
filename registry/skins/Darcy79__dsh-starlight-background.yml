id: darcy79.dsh.starlight.background
name:
  zh: 星轨光感
  en: Starlight Field
author: Darcy79
description: 覆盖整个窗口的星轨光场：右侧海风插画随呼吸轻摆长发与裙边、鲸尾绕连接处轻摆，约每 4–8 秒眨一次眼；流星按推理深度联动，按档位固定 2/4/7/10 颗，另有周期流星与高亮「新想法」流星。右下角齿轮独立控制总开关、流星与插画动效，Alt+L 也可开关；开启后输入框变玻璃，深浅色各有插画透明度。
