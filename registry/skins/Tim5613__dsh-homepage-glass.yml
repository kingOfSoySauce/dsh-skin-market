id: tim5613.dsh.homepage.glass
name:
  zh: 流动蓝
  en: Flowing Blue
author: Tim5613
description: "左侧栏固定深蓝渐变、不跟随明暗，右侧内容区仍按当前外观走，主按钮用官网蓝 #4d6bfe。浅色模式还能把内容区换成复刻 deepseek.com 首页的「官网流动」背景——直接跑官网原版 WebGL 着色器，约 70 秒横穿一次，系统减少动效时只画一帧。"
