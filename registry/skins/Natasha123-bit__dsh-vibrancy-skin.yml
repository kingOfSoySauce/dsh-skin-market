description: 把会话面板、侧栏、气泡和输入框那层不透明底色换成同族半透明，让窗口自带的 macOS 原生磨砂透出来；强度分磨砂 24%、均衡 40%、实心 62% 三档，背景可选「透到壁纸」垫自己的图或「透到桌面」，只换材质、布局不动。
