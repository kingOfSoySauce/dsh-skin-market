id: theskywilldawn.dsh.stamina.pet
name:
  zh: 大肥鱼体力条
  en: Bigfish Stamina Bar
author: theskywilldawn
description: 给每个会话配一只住进会话头部的大肥鱼：一条体力条看上下文余量，另一条看她是否清醒，点一下就落到桌面、再点收回。她会随上下文变满而蔫、坐着睡或趴睡，戳会弹、连戳五下会生气、按住揉头会累计次数；纯 canvas 手写 Live2D 驱动动作与表情，右键可换大小、衣服、配色与动作。
