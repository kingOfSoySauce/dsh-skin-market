description: 会聊天、会动、能按人设与语音回应的桌宠，既能当插件跑在界面里，也能在 Windows、macOS、Linux 上独立运行。核心差异是可选的 PowerContext + seekdb 本机长期记忆：把事实与偏好抽出来存进本地记忆库，清空近期聊天后仍能召回，聊天模型与记忆模型分开配置。
