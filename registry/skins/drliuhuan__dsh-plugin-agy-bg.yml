id: drliuhuan.dsh.plugin.agy.bg
name:
  zh: 反重力粒子背景
  en: Antigravity Particle Backdrop
author: drliuhuan
description: 在界面背后铺一层跟随鼠标的 WebGL 粒子背景：整页外壳变透明，粒子场从工作区透出来，侧栏、输入框、卡片和弹窗保留自己的底色。粒子环带缓动、呼吸半径、环带位移与低速漂移，配色随明暗主题切换；设置 → 通用里的开关可随时关掉，帧率分节能、普通、高性能三档。
