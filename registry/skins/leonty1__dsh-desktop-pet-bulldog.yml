  zh: 法斗桌宠
  en: Bulldog Desk Pet
author: leonty1
description: 桌面上一只透明、无边框、始终置顶的法斗，动作来自真实会话状态：待机、思考、工作、等待、成功、出错各对应精灵片段，执行命令与搜索、读写文件会分动作。任务卡能展开多任务表，6 秒后折成胶囊。可拖动、摸头、点爪、甩尾；设置里调大小、活跃度、趴下与入睡时间、提示音和全局快捷键。
