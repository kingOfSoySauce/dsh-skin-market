id: weixiurui.dsh.firefly.forest
name:
  zh: 萤火森林
  en: Firefly Forest
author: weixiurui
description: 界面后方一层夏夜灌木林：一夜压缩成 45 分钟的夜之流，入夜、深夜、将明依次推进，色温、雾、月光、虫量与声音连续变化；全局风场每 16–42 秒一阵，驱动草叶、雾、落叶、雨丝和萤火虫。萤火虫各有色温、闪频与作息，靠近会「对闪」，被照亮的蛾子、猫头鹰或狐狸会引来光团；还有月相月光、每天首次打开的苏醒、偶发蛛网，以及刺猬、小熊猫、小浣熊三种每 70–180 秒路过的小动物。
