id: loyalchiiina.dsh.sidebar.media.player
name:
  zh: 侧边栏多媒体播放器
  en: Sidebar Media Player
author: loyalchiiina
description: 作为 dsh-better-sidebar 的配套插件，把侧边栏里的音视频预览换成一个统一播放器：覆盖 mp4/webm/mov 等视频与 mp3/flac/ogg 等音频，进度条通过 HTTP Range 流式拖动，带实时频谱、音准（Hz 与音名）、同名 .srt/.vtt/.ass 字幕和 .lrc 歌词滚动高亮。
