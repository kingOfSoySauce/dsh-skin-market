id: vianvio.dsh.assistant
name:
  zh: DSH 小助手
  en: DSH Assistant
author: vianvio
description: 由会话事件驱动的 macOS 原生悬浮伴侣：透明无边框窗口常驻在其它应用之上，按真实状态切换待机、思考、执行、等你确认、完成、出错等七个状态，同状态还会随机换姿势；多项目并行时气泡只写谁在跑、谁在等你，完成 / 出错 / 待确认另起可点击通知。右键还能生成当天「今天干了什么」日报，按项目聚合成 Markdown 并一键复制。
