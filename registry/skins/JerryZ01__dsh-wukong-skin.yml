description: 输入框右侧多一条强度滑轨，拖动时孙悟空从石猴、美猴王、齐天大圣、孙行者、斗战胜佛一路走到斗战胜祖：31 帧人像逐级变化，界面配色在石白、赭石、蟠桃金、丹炉火、黑金之间插值，深浅主题与人像同步。滑轨档位直接读当前模型的推理等级，跨果位播一句台词，朗读默认关闭。
