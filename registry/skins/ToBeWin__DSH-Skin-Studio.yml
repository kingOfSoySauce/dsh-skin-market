id: tobewin.dsh.skin.studio
name:
  zh: 皮肤工作室
  en: DSH Skin Studio
author: ToBeWin
description: 在设置 → 皮肤工作室里切换 10 套内置皮肤，或用「自定义画布」做一套全局外观：上传不超过 5 MB 的本地背景图，选浅色或深色基底，分别调背景、表面、强调与文字颜色，再缩放、移动或拖动焦点为图片取景。图片与配色只保存在本机并即时应用到整个界面。
