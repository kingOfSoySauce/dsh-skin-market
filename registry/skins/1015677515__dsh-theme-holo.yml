description: 羊皮纸底＋麦金强调色的《狼与香辛料》赫萝主题：约 12 秒的 canvas 开场动画从暗处红眼、狼影描红、光爆到标题解码，输入框边有只露兜帽与双眼的她会探头，右栏待机画面六片可换，还有可拖动的「狼与香辛料」字标、动态档案卡、侧栏麦田与羊皮纸便笺。七组装饰各有独立开关，深色「星夜麦田」仍是测试功能。
