id: mjh520.dsh.welcome.boot
name:
  zh: 自定义启动视频
  en: Custom Boot Video
author: MJH520
description: 启动时默认播放自带的一段鲸鱼女仆开机动画，也可以在「设置 → 内置插件」里换成自己的视频、动图或静图（mp4 / webm / gif / webp 等 20 种格式），支持声音开关、播完渐隐时长、铺满或完整显示、播放速率和跳过方式；内置视频关掉且路径清空时完全不介入启动。
