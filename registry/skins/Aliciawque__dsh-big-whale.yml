description: 三语语音配口型的大鲸鱼看板娘：日常女仆装之外，还能在小鲸鱼菜单里换成万圣节小魔女——南瓜按钮、鬼魂提灯、分层裙摆各自回弹。她跟随鼠标、可拖拽甩动，5 种待机动作和 8 种表情会随会话事件切换：上下文压缩时捧碗低头，任务完成微笑比耶，失败时垂眼冒汗。
