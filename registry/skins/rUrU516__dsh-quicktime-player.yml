id: ruru516.dsh.quicktime.player
name:
  zh: 侧栏视频台
  en: Sidebar Video Deck
author: rUrU516
description: 在右侧栏注册一种视频标签页，文件页、聊天引用或其他侧栏插件打开的视频都落进这里。Host 用 HTTP Range 流式输出，进度可拖动；Desktop 的 dsh-app:// 下改走带 token 的 127.0.0.1 端口。滚轮 1×–8× 缩放、平移、双击全屏，0.2×–5× 变速、逐帧、画中画、截图到剪贴板，两个剪刀标记用宿主 ffmpeg 流拷贝导出无损片段，位置与设置按路径记住。
