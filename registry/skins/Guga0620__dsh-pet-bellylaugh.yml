description: 奶龙常驻界面右下角，动作跟着 Agent 工作状态走：待机呼吸眨眼、工作时揉肚子、每次工具跑完左右小跑、任务完成捧腹大笑并冒「哈哈哈哈哈哈哈哈」、出错抖一下。形象与笑声可热换（8 列 × 9 行精灵图，单帧 192×208），可拖动记位置、右键归位、长按抚摸。
