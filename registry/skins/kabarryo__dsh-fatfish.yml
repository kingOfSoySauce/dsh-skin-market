id: kabarryo.dsh.fatfish
name:
  zh: 输入框大肥鱼
  en: Composer Bigfish
author: kabarryo
description: 贴在输入框上沿外侧、约 96px 见方的大肥鱼：待命、输入、生成、等批准、等回答、出错、完成、闲置、上下文吃撑九种状态各配一组表情，进入状态随机挑一张，同一状态停留超过 45 秒自动换一张；闲置有脚本，从摸鱼、不想说话一路演到困了、晚安、充电中。29 张挑好的表情合成动画 WebP 内嵌在 client.js。
