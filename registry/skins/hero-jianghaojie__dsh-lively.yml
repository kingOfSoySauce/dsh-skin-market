description: 在界面后方垫一层动态壁纸：Flow、Aurora、Starfield、Lava、Mesh、Neon Grid 六套程序化预设各有明暗变体，也支持图片、GIF、WebP、AVIF、MP4 或 WebM（URL 或本地上传，文件存 $DSH_HOME/dsh-lively-media/）。可调壁纸强度、暗化、视频柔化与动画速度，播放列表按 1–240 分钟轮换任意子集，设置里还有壁纸库。
