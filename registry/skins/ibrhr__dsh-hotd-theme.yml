name:
  zh: 龙之家族主题
  en: House of the Dragon Theme
author: ibrhr
description: 以《龙之家族》龙石岛为底的主题：浅色是羊皮纸暖调、深色是黑曜石配绯红高光，两侧有角色立绘、龙焰余烬粒子和自定义矢量图标，头部与输入框用毛玻璃。顶部徽章还顺带统计 OpenCode 花费与 token、显示 DeepSeek API 半价/高峰倒计时，点开是 14 天用量看板。
