description: 装一次就能在界面里换皮肤：十套内置壁纸皮肤（云海星球、比奇堡晴日、冰川河谷、富士夜色等），点卡片即时生效不用重启；面板不透明度、壁纸模糊与亮度三个滑杆实时调参；也能把自己的图片或 mp4/webm 视频做成新皮肤，调好的方案可导出 .dshskin 分享、导入即还原。
