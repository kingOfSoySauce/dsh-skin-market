description: VS Code 官方聊天宠物 Blobby 的非官方移植：坐在输入框上方，跟随光标视线、打字、思考，需要你输入时鼓掌，20 秒没动静就睡着，回合结束踩红钮庆祝；可拖动、甩出、接住，右键换 13 顶帽子与自定义配色，还能玩跳跳乐。Windows 桌面端在窗口最小化或被遮挡时会走传送门落到任务栏上方，双击可把窗口叫回来。
