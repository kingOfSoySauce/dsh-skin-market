id: taotao7.dsh.pretty.cool
name:
  zh: Pretty Cool 紧凑界面
  en: Pretty Cool
author: taotao7
description: 把消息、队列和任务状态收紧的紧凑界面：普通消息去掉卡片边框，推理内容用细线展开，过程摘要收成一行。模型搜索、思考级别循环切换、工作目录、上下文占用和原生统计集中在输入框周围，Goal、To-dos、子 agent、后台任务排在输入区上方，外观提供 Light / Dark / System、字号和 0–16 的全局圆角（默认 6）。
