id: fengyevvv.dsh.wallpaper.intro
name:
  zh: 壁纸与片头
  en: Wallpaper & Intro
author: fengyevvv
description: 在界面背后铺本机图片、视频或 Wallpaper Engine 视频壁纸，启动时再播一段自定义片头。片头可以是任意视频或图片，能调展示时长、淡出和声音，点画面或按 Esc/空格/回车跳过；遮罩、模糊、画布不透明度亮暗各一套，拖动即时生效。另带壁纸轮播与右下角快捷面板。
