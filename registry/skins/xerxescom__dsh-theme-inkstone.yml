id: xerxescom.dsh.theme.inkstone
name:
  zh: 砚
  en: Inkstone
author: xerxescom
description: 暖墨加一点朱砂：纸白暖中性阶（OKLCH 80°）承担表面，一个朱砂红承担全部强调色，注册 inkstone-light 与 inkstone-dark 两个可选主题，默认浅色，可在设置里切回原主题。149 个 token 加 8 个非颜色声明按明暗成对写出，38 组前景/背景配对按合成后的颜色算 WCAG 对比度并全部抬到下限之上；可选背景图默认关闭，开启后铺图、盖同色遮罩并加 3px 模糊。
