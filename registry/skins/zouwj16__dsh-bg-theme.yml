id: zouwj16.dsh.bg.theme
name:
  zh: 界面底色（暖色）
  en: Interface Palette (Warm)
author: zouwj16
description: 以 Claude 桌面端深色主题的实测值重绘一套暖色表面：画布、抬升层、侧栏及其三态、卡片与选择器、输入框、用户气泡、代码块、滚动条与文字阶梯都换成暖灰 / 暖白，浅色与深色各一套并跟随「浅色 / 深色 / 跟随系统」自动切换；只改颜色 token，不动布局、字号与字体族。另附可选的 Windows 原生窗口底色补丁（等长改写 app.asar，带 --verify / --revert），消除呼出时的白闪。
