description: 一组各自独立的开关：8 套极简主题（青瓷、亚麻、奶油、石墨、靛蓝、雾蓝、苔绿、玫瑰，每套带明暗两版配色）给整套界面上色，侧栏面板行收成一个可搜索、可用键盘操作的双列启动器，桌面端侧栏底部还有刷新界面与重启两个按钮。插件页另带更新标签页，只安装发布满 24 小时的版本，并跳过与当前版本不兼容的发布。
