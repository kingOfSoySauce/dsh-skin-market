author: duty25
description: 鸣潮爱弥斯像素风主题：像素小爱弥斯默认坐在输入框上方，可拖到任意位置，并随 Agent 工作、出错、完成换动作；空闲会伸懒腰、打哈欠，摸头会记好感度。星夜背景可调暗度与模糊、也能换成自定义图，另有四套配色、像素按键与通讯卡式回复，设置页是频段柱样式。
