description: 在侧栏加一个网易云音乐面板：搜索歌曲与歌手、热门/新歌/飙升/原创榜单（也可填歌单 ID）、收藏与最近 600 条播放记录、逐字歌词与翻译，再加基于收藏与播放的品味推荐；浮动迷你播放器支持队列、随机/循环和下载官方音源。只播放官方接口允许的内容，不破解 VIP 或地区限制。
