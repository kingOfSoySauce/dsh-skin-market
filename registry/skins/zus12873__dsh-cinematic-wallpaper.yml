description: 每次打开页面先播 7 秒电影感开场：光线、线框、面扫，角色睁眼、虹膜泛绿、镜头推近；点按或任意键可跳过，片头期间的按键不会漏进输入框。落幕后角色留在界面后方当动态壁纸，头发半速来回摆动约 24 秒一循环，文字按背后画面自动取深/浅色，输入框在浅色下 28%、深色下 30% 不透明。
