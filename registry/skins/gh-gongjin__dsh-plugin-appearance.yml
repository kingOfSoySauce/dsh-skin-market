id: gh.gongjin.dsh.plugin.appearance
name:
  zh: 桌面外观
  en: Desktop Appearance
author: gh-gongjin
description: 在设置里加一个「桌面外观」面板：8 套配色（每套 28 个颜色令牌，明暗两档）加一个「不覆盖」，不点就什么都不改。侧栏图标、会话首屏图标和名称行可分别替换：内置六枚标志或上传图片（自动裁方压到 200KB 内），名称行还能用原字标、自定义文字或图片，另有一键全部还原。
