description: 整屏浮层上一只可拖的灵宠：布偶猫、金毛、水豚三只常驻，轻叩蓄能 +1、连击出星星眼，会眨眼、打盹，位置按窗口百分比记住；侧栏面板可换宠、调大小（30%–300%）与音效。也能导入自己的宠物——照片变 2.5D 立绘，GLB / VRM / STL / OBJ / PLY 变可拖着旋转的真 3D，数据全在本机。
