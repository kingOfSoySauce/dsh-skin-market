description: 用一张黄昏富士与便利店照片铺满整个窗口，上面盖一层随设置变化的冷白玻璃；九种材质、四种边缘、漏光与暗角都可调，输入框和面板沿用同一套材质。输入框上方还有 1236 条氛围语句、系统时间与 Open-Meteo 天气，开场是约 4 秒可跳过的显影动画。
