id: picklerick422.dsh.motion
name:
  zh: 弹窗动效
  en: Popup Motion
author: picklerick422
description: 给近距浮层、远距对话框和悬浮提示补上有物理感的入场：菜单类从触发按钮实测尺寸 clip 形变并用弹簧长出（438ms、过冲可调 0–25%），设置与确认框用 280ms 从下方 60px 浮出，提示走 204ms 无过冲；另有气泡连贯切换、图片 FLIP 放大和可三段实时预览的设置页，流式输出或掉帧时自动降级为纯透明度。
