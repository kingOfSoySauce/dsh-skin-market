description: 工业电子风格的全直角界面：深蓝工作区、恒为白色的字色、左上角鲸鱼剪影加 DEEPSEEK 字标，双外观可跟随系统也可手动锁定浅色/深色。六套低饱和配色（黛蓝、宋青、橙青、深蓝、粉霞、暮紫）只改结构色与强调色，壁纸、毛玻璃对话框与扫描线质感分别可调。
