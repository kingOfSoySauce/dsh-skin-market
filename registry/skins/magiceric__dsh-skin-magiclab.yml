description: 五套可切换皮肤：长征（近黑暖金）、声呐（深青荧光绿）、翻牌（灰底琥珀数字）、胶片（暖棕颗粒加 2.39:1 遮幅）、水墨（宣纸墨染），每套连侧栏、对话框、输入框和代码块一起换。每套还配专属启动动画与音效，可在「外观实验室」里切换、重播和开关声音。
