  zh: 透明磨砂
  en: Transparent Frosted
author: Yuanqs-pine
description: 把整个界面变成一块透明磨砂玻璃：一条滑杆在真模糊的磨砂与背景彻底消失之间连续过渡，整页区域、组件和展开面板作为一张纸一起变化；设置页有独立滑杆（默认 72%/62%），另带可选的鲸鱼粒子；桌面端透出你的壁纸，Web 端则自绘深色渐变兜底。
