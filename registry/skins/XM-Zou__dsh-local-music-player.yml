id: xm.zou.dsh.local.music.player
name:
  zh: 本地音乐库
  en: Local Music Library
author: XM-Zou
description: 左侧栏「音乐」入口打开本地音乐库：导入文件或整个文件夹（文件夹名自动成歌单），读取 ID3v2 标题与封面，文件名里的《》会拆成歌名与歌曲信息。歌单可多对多、拖动排序，未分类歌单置顶；播放支持暂停、切歌、进度、音量、随机与列表/单曲循环，另有 ZIP 备份恢复和中英双语界面。
