description: 昼夜双壁纸：亮色用白天插画、暗色用夜景插画，跟随外观设置自动切换。正文落在左侧一层薄纱阅读底板上（约 55% 底色加 6px 磨砂），右侧留白让壁纸人物保持清晰；侧栏、整页内容、编辑器与文件预览按层给不透明度，设置弹窗压到 0.92 并加磨砂。
