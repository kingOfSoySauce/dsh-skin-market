  zh: Nebula 主题
  en: Nebula Theme
author: gioguarin
description: 靛紫夜空铺满页面上方，底部一条活火线随状态起伏：空闲时只留低伏余烬，会话运行时火焰前沿升起，浮动聊天窗也带上余烬边框；暗色阅读纱保证正文对比度，输入区做成玻璃板让火光透出。火焰场 256×112，空闲 12fps、运行 30fps，明暗两种模式都覆盖同一套配色，减少动态效果时火焰静止。
