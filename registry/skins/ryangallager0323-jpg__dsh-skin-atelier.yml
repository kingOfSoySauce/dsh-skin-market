description: Atelier 工坊：暖白纸感画布（#faf7f0）配极轻纸纹与暖杏/松绿环境色，正文统一为暖墨色，一二级标题用宋体，焦点环、链接与状态点用深松绿；输入框、对话框与菜单使用接近 iOS Liquid Glass 的毛玻璃（输入框 blur 15px、对话框先柔化整页再铺 46px 玻璃），深色模式改为烟熏玻璃。只做视觉重绘，不改功能；另外锁住整页滚动、让加号菜单打开时不再带动正文。
