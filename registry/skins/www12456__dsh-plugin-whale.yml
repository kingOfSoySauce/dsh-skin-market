  zh: 鲸鱼状态条
  en: Whale Status Bar
author: www12456
description: 对话界面加一条随会话状态换泳姿的鲸鱼：静止、思考、工作中三档，一轮回答结束跃出水面捕食；侧栏粮仓可展开充值、赠送和今日消耗，低于阈值时图标变橙；另有峰谷海面、用量金额、接零食小游戏和沙漏定时发送。
