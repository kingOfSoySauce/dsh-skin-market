  zh: 蓝色大肥鱼主题
  en: Blue Bigfish Theme
author: yryd
description: 海洋蓝亮暗双主题：海面光晕、上升气泡与来回游动的鱼群，输入框上方滚动「每日鱼语」，左上角换成鲸鱼图标加「蓝色大肥鱼」字标。设置页共 7 组 32 项即时生效（鱼群数量与速度、光晕强度、语录列表等）；只改主色时其余 10 个设计 token 按色相平移派生，语义状态色保持不变。
