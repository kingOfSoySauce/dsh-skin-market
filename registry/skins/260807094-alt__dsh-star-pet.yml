description: 上班计时桌宠「困困星人」：桌面透明置顶窗口实时显示今天已经赚了多少钱、还有多久下班、之后还能赚多少，可按 0/1/1.5/2 倍率设置加班时段工资。收回成桌宠后可拖拽、贴边吸附，按剩余秒数冒「+¥」，右键设置外观与薪资配置，另有几种点击动画与提示音。
