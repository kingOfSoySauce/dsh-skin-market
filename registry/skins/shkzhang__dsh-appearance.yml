id: shkzhang.dsh.appearance
name:
  zh: 外观设置
  en: Appearance Settings
author: shkzhang
description: 把主题、字体、字号、会话流密度与液态玻璃收进一个「外观」设置页：浅色 3 套、深色 8 套主题预设，各自从 10 个种子色推导 90 余个界面 token。UI 与代码字体可选本机字体，字号分别为 10–24px、9–24px；液态玻璃只作用于菜单与模态对话框。
