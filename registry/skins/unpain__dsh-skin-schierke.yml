id: unpain.dsh.skin.schierke
name:
  zh: 史尔基 · 灵界魔导书
  en: Schierke · Astral Grimoire
author: unpain
description: 把界面重排成一册摊开的灵界田野志：侧栏是布面章节索引，输入区是带页边线的观察条，消息、推理、代码和设置分别变成页边批注、脚注、墨块与附录页。亮色用骨纸、褪鼠尾草、石南紫与赭墨，暗色用夜纸、月玉与暖象牙字；随包附一幅可收纳的角色图版，活跃会话时淡出，也可完全去掉而不丢皮肤身份。
