description: 21 套水果主题：柠檬、柚子、青柠、西瓜、西瓜冰、草莓、蓝莓、葡萄、苹果、蜜桃、樱桃、橙子、芒果、猕猴桃、菠萝、火龙果、石榴、牛油果、椰子、香蕉、荔枝，每套 15 色推导出约 55 个语义色变量，明暗两套值自动跟随。换肤入口在「设置 → 主题风格」整页画廊，也可在输入框上方横条直接弹浮层；另带聊天消息编号 T01/回复 T01（可关）与过程行左侧主题色竖线。
