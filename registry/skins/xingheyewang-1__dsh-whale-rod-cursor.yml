description: 把系统光标换成一根鱼竿，线上吊着 Q 版鲸鱼娘：鼠标移动她就猛拽、甩飞、荡几下收回，甩猛了冒出字随力度变大的萌语气泡，停下演「钓鱼佬又空军了」小剧场；鱼竿会按悬停对象变色（输入区青绿、按钮淡金、按下橙红），还会跟着会话状态切平时 / 在忙 / 干完了三种姿态。
