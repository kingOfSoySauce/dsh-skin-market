id: zhengmin486.dsh.desktop.pet
name:
  zh: 悬浮球桌宠
  en: Floating Ball Pet
author: zhengmin486
description: 系统级悬浮球：平时是一颗小鲸鱼球，鼠标移上去向右展开成灵动岛，上方显示账户余额、下方是精确到秒的运行时长，最右侧齿轮点开设置面板，拖滑块同时改悬浮球与灵动岛大小（40–96px）。单击球把主窗口叫到最前；可换 GIF/PNG 图标，检测到游戏全屏自动隐藏，托盘菜单与开机自启齐全。
