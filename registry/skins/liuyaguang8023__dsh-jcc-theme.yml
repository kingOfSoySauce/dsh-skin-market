description: 金铲铲同人外观：浅色是羊皮纸棋盘地图，深色是奥术蓝黑竞技场，背景用内联 SVG 画六边形看台、金色铲影与海克斯晶体。右下角「海克斯核心」面板可换四枚强化符文、三档棋盘纹理、圆润或锐利棱角与氛围光效；「海克斯强化」三选一抽外观卡，共 12 张，本地存图鉴。
