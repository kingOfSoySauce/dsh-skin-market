description: 绘本风换肤：奶油暖底＋暖墨文字＋低饱和玫瑰点缀，明暗两套色板；五张插画做成拍立得照片墙沿界面四周散布、向中心渐隐，鼠标移动时按各自深度反向视差。右下角常驻 Live2D 小叽，视线跟随鼠标，会话开始运行时切到 Look；窄窗口自动收起边缘照片，桌宠可在插件页单独开关。
