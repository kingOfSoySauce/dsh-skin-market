description: 左侧栏进网易云风格的发现页：3 张大 banner、20 个城市入口、12 张分类卡与自适应网格，点分类卡会随机挑一台开播；卡片和播放页显示 FM/AM 频率。全屏播放页有模糊台标背景、旋转台标和频谱、波形、环形三种可视化，底部常驻播放条；后台播放收进侧栏迷你条，与网易云音乐自动互斥。
