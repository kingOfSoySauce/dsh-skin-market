description: 玄墨鎏金配色：亮色是暖宣纸底 + 古金强调，暗色是玄墨底 + 鎏金强调，跟随明暗切换；空白会话在问候语上方显示梁圣半身立绘（左实右虚渐变遮罩），输入框工具行里按当前模型档位铺点的推理滑杆可拖拽，立绘会随档位变壮、光环变亮，另有 9 秒轮换的中英圣言飘带与右下角淡金印章水印。
