description: 会看会话的桌宠：新会话、排队提示、思考、工具执行、成功与失败对应九种动作，挂官方 shell.overlay 与 settings.section 槽位，不替换产品布局。每个动作都能换成自己的 WebP，九个状态加左右键都能映射内置或自定义音效；导入素材存在 $DSH_HOME/pet-assets/dsh-juan-pet/，经过大小、扩展名、MIME 与 magic byte 校验。
