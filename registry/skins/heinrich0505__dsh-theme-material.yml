description: 一个 token 引擎从十个输入推出整套颜色，共八套主题：Palenight、Ocean、Darker、Lighter、Catppuccin Latte、Vitesse、Snazzy、GitHub Gray。设置 → 通用 → 主题里点色卡即换，选深色主题时会把外观一起切到深色。每套自动补齐另一侧的明暗版本，正文对比度不低于 7:1。
