id: troodon.dsh.big.fat.fish.girl
name:
  zh: 大肥鱼女孩
  en: Big Fat Fish Girl
author: troodon
description: 透明置顶窗口里的桌宠：主界面最小化时仍浮在其他应用之上，跟随所有会话的活动，展示当前工作、工具调用、请求、完成与出错；有请求时优先显示等待动画，完成后显示服务商上报的输入输出 token。空闲有视线跟随、悬停反应、随机动作、睡觉与偶发横移，连续工作 3–5 分钟可出现零食动画；点击她把主界面唤回到上次会话。支持英/俄/简中，尺寸 88–172px。
