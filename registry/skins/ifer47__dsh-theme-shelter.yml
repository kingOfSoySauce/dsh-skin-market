id: ifer47.dsh.theme.shelter
name:
  zh: 檐下
  en: Shelter
author: ifer47
description: 给界面加一层很薄的天气：右下角 28px 按钮切换雨、雪、炉火或关闭，强度分轻中暴。雨滴落地会溅开水花并随风倾斜，闪电先在分叉处亮起、隔一会儿才响雷；雪会在窗口底边长出积雪，炉火有暖光与上升的火星。雨声和火声是录音，雪风由代码合成，另有夜间配色。
