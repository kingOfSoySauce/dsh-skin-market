id: matriiix67.dsh.theme.studio
name:
  zh: 精装修 · 主题工作室
  en: Theme Studio
author: matriiix67
description: 在 DSH 里打开可调的主题工作台：25 套预设（10 套原创加 15 套 VS Code 配色），可改强调色、明暗两套底色与面板色，换界面与代码字体，上传壁纸并调整铺放、透明度与模糊，切换实色到通透的面板材质。还能替换侧栏品牌、导入导出 JSON、写自定义 CSS。
