description: 在界面里边聊边听喜马拉雅：搜索专辑与有声书、翻曲目列表、一键播放，输入区上方常驻播放条支持上下集、快进快退、进度拖动、音量与 0.75–2x 倍速。订阅、收藏和关注会写回账号并与手机 App 同步，也能直接对 agent 说「播放三体」触发播放。
