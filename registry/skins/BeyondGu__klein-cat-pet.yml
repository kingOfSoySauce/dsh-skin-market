description: 住在界面右下角的黑色小猫：小礼帽、黄水晶和甜冰茶。单击她在「努力工作中 / 累了 / 休息中」三种状态间循环，每态都是手绘 SVG 动画并配独立音效；可拖动并记住位置，悬停出现静音、复位、隐藏小工具栏，侧栏底部猫爪按钮开合宠物，系统开启减少动态效果时自动停掉循环动画。
