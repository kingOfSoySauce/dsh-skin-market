description: 把 Windows XP Luna 搬回界面：左侧蓝色渐变任务栏列，对话、插件与自动化任务页装进半透明米色玻璃窗，配光泽 Luna 标题栏与三枚 XP 式标题按钮；约 141 个 token 覆盖成米色工作区、方角硬阴影与不透明菜单。壁纸不随包，在「设置 → XP Luna 主题」导入本机图片，只存本机。
