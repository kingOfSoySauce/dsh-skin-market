description: 重做对话页的界面与交互：思考过程按分析/搜索/编辑分组折叠，右侧问答时间轴可悬停预览并跳转轮次，工具调用与代码改动各有独立卡片，改动能在侧栏左右对照查看。内置 8 种界面语言和浅色/深色/跟随系统主题，回答可渲染成数字卡片、图表、流程图、闪卡与带滑块的计算器等交互组件。
