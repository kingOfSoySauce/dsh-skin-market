description: 把 Web 界面刷成星露谷物语配色：展示标题用内嵌的 Fusion Pixel 像素字体，App 背景换成像素山谷（内嵌 JPEG，--dsw-alias-bg-base 透明），约 70 个 dsw token 覆盖奶油纸面、深棕描边、木按钮、谷仓红与草绿，圆角压到 2px，选区换成星露谷黄；不替换官方前端，正文与代码排版保留。只接 Web，light/dark 两组 token 同值。
