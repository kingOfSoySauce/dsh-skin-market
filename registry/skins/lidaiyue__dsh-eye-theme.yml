id: lidaiyue.dsh.eye.theme
name:
  zh: 护眼深色主题
  en: Eye-Comfort Dark Theme
author: lidaiyue
description: 护眼深色主题：把内置深色底的冷蓝偏色（#151517，正文对比度约 17.5:1）换成更柔和的松烟，侧栏与会话同色、去掉侧栏那条更暗的黑带；界面字重可选 400/430（Codex 粗细）/450/500，聊天行高可选默认、紧凑（−4px）、更紧（−6px）。浅色主题与全部状态色（成功/警告/危险）保持原样；样式走宿主 theme.overrideTokens，卸载即恢复内置外观。
