id: aeonsscope.dsh.fellowmoon.theme
name:
  zh: 超管局主题
  en: FellowMoon Bureau Theme
author: aeonsscope
description: 以《新月同行》超现象管理局为灵感的主题：橙 = 一线特工、黑 = 精锐、白 = 中层、深蓝 = 高层的配色语言，组成「白昼巡查」与「夜间收容」两套外观并可跟随系统；全窗口铺暗色网格与徽标底纹，侧栏压一张淡化人像，聊天框底部垫橙徽水印，聊天消息可选液态折射或磨砂遮蔽。设置页可切「部门配色」，启动时还会走一遍六幕 CPO 授权开机动画。
