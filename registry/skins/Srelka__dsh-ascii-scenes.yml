description: 八套会动的字符场景铺满侧栏与主工作区：Claude 暖夜、蓝天浮云、海龟潟湖、池塘锦鲤、深海水母、水面纸船、夏夜萤火与夜空月色，每套都有点击回应（吹风、水波、散开的光点等）；背景点击避开按钮、输入框、文字与选择，跟随系统减少动态效果，页面隐藏时暂停。
