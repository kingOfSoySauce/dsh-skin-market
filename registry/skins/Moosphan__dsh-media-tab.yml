id: moosphan.dsh.media.tab
name:
  zh: 本地媒体播放器
  en: Local Media Player
author: Moosphan
description: 在回复下方直接内嵌播放本地视频和音频，也能在右侧栏打开完整播放页，最近播放保留 20 条。点交付卡片或说一句「播一下 /path/a.mp4」即可起播，支持常见 mp4/mkv/webm 与 mp3/flac 等格式，零运行时依赖、不需要 ffmpeg，媒体经本机白名单与签名地址转发，可拖动进度。
