id: wuyad.cat.plugin
name:
  zh: 漫游小猫
  en: Wandering Tabby Cat
author: wuyad
description: 一只虎斑小猫在界面上游荡：沿段落、标题、卡片和按钮的上沿行走，跳上平台、闻一闻、打盹，偶尔瞬移或从边沿摔下去后自己恢复。点一下可以撸猫，右键切换橘猫、白猫、奶牛猫、黑猫、灰猫、暹罗猫六种皮肤并记住选择；它偶尔会留下便便，点掉即可清除。
