id: youxin484.dsh.pet.open
name:
  zh: 打开桌宠
  en: Open Pet Button
author: youxin484
description: 在输入框工具行、模型强度变阻器左侧加一个「打开桌宠」按钮，一键把被「本次隐藏」藏起来、又没有恢复入口的桌宠叫回来。点击后调用桌宠的配置接口：先尝试启用，必要时关再开触发 helper 重启，失败重试三次，并保证最终恢复到启用状态；composer 空间紧张时只留图标。
