description: 把抖动信号场背景、蓝图标题字效、毛玻璃输入框和 ASCII 鲸鱼动画接到新建会话页与聊天页：信号场随指针拖尾擦除 / 点亮并有点击涟漪，标题字可拖拽、靠近时转虚线轮廓，鲸鱼与鱼群叠加在信号场之上；两页各有独立开关与参数，在「设置 → UI 动画」逐项调整，亮 / 暗配色自动跟随。
