description: 深海潮汐蓝的 6-3-1 配色主题：60% 深蓝画布、30% 哑光卡片表面、10% 单一潮汐蓝强调，0.5px 发丝描边代替辉光；另附工作流增强——底栏常驻 HUD 显示会话规模、上下文容量、计入首字延迟的真实 TPS、缓存命中率与模型耗时，点开是用量看板，子代理派发画成带 token 与预估金额的 Agent Graph，侧栏分出置顶小节。
