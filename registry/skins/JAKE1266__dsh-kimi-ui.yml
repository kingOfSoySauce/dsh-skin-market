description: "Kimi 风格换肤：以 Kimi 官方色板为锚点，品牌蓝 #1783ff、暖灰中性面与暖白/中性暗面，深色优先；气泡 20px、输入卡 28px、面板 24px 大圆角，胶囊、菜单与面板用 20px 模糊的玻璃质感，发送键与品牌字为蓝到深紫渐变，覆盖全部语义色令牌。侧栏品牌与新会话首页换成自绘月牙 SVG 和四个快捷胶囊；预览图为示意图，非实机截图。"
