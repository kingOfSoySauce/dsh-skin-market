id: theembers.dsh.workspace.icons
name:
  zh: 工作区与会话图标
  en: Workspace & Session Icons
author: Theembers
description: 在「重命名工作区」弹窗里直接给工作区选图标，并为本地发起的会话设置默认图标；会话行比工作区多缩进一级、从工作区图标垂下一条引导线，把侧栏画成清晰的两级结构。内置 73 个 Lucide 图标，可上传 SVG（≤64KB），也能关联 Iconify 图标库（官方目录 276 个库）后按库搜索选用。
