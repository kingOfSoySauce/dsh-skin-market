description: "给界面的瑞士风配色：纸色、墨色和四档中性灰承担层次，只留一个强调色 #1B3BFF；浅色是冷白纸配淡蓝侧栏，深色是深蓝夜底 #0F1A35 而不是纯黑。圆角收到 2–12px、阴影换成发丝线、字体以 Inter 优先，明暗仍由设置里的外观控制。"
