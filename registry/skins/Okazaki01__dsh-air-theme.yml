description: 《AIR》夏日青空主题：神尾观铃全景铺满窗口，浅深两套；11 片羽毛随机落速飘落，三层 CSS 云缓慢横移，思考时起双环魔法阵，发送键是带光晕的魔法书与点击涟漪。输入框四角有定制弧形金饰、上边框中央嵌金色宝石徽章，侧栏有 Q 版观铃剪影与樱花枝；打开设置窗口时主题自动让位，可经 dsh-skin-switch 热切换。
