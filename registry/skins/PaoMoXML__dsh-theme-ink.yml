description: 原生优先的主题：保留全部原生组件与控件，只改主题 token 层——六套调色板（host、Claude 亮色/暗色、巧克力薄荷、Vue、薄荷）、原生/紧凑两档工作区密度、方角/圆角与 ASCII 字形开关，还可隐藏左上角 logo。全部选项集中在「设置 → 通用设置」的一行里。
