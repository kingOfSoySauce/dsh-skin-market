description: 本地优先的音乐播放器：导入音频文件或整个文件夹（文件夹名自动成为歌单名），读取 ID3v2 标题与封面，歌曲能加入多个歌单、侧栏歌单可拖动排序。播放支持随机与列表/单曲循环，切换面板后通常继续播放；音乐库、封面与歌单存在浏览器 IndexedDB，可整体导出或合并导入 ZIP。
