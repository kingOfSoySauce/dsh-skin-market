id: ffyfox.dsh.theme.mist
name:
  zh: Mist 主题
  en: Mist Theme
author: ffyfox
description: 把移动端 DSH Go 参考设计的色彩与材质搬到桌面与 Web：低饱和中性色、0.5px 发丝描边、底部输入区真实毛玻璃、右上角单点氛围光晕，侧栏有玻璃与平铺两种材质。内置雾蓝、黛青、暮紫、松石、琥珀、石墨六套强调色，与浅色/深色/跟随系统叠出 12 种组合且都过 WCAG AA，设置→通用设置里直接切换。
