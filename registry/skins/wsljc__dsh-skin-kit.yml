id: wsljc.dsh.skin.kit
name:
  zh: 皮肤引擎
  en: Skin Engine
author: wsljc
description: 可插拔的皮肤框架：用 overrideTokens 把一层 token 覆盖叠在当前主题之上，不抢主题偏好，因此能和内置明 / 暗以及第三方主题共存；内置 P5R 漫画（红黑黄纸白 + 日式车站动态背景）、纸白纸墨（明暗自适应）和终端绿（黑底荧光绿 + 扫描线）三套，在「设置 → 通用设置 → 皮肤」一键切换。加自己的皮肤只需写一个数据文件（token 表 + 装饰 CSS/DOM）。
