  zh: 潮汐之间
  en: ASCII Orca
author: LeriusLei
description: 界面背景是一整片 ASCII 字符绘成的三维海洋：三头虎鲸巡游、翻滚、下潜，偶尔浮出水面喷水、追赶鱼群或跃出海面溅起浪花，海色按本地时间从深夜换到黄昏。可切换三种海天构图，并调亮度、饱和度与柔化，聊天区保持透明。
