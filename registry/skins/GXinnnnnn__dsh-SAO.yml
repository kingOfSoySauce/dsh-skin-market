description: 刀剑神域主题：原生还原 Link Start，提供桐人／亚丝娜语音、NerveGear 音效、音量调节与手动预览；GUI 自适应宽屏、超宽屏、竖屏及播放中窗口缩放与设备旋转；可选全部功能或仅限启动动画，启动白底以真实透明通道自然透出已加载界面；明暗主题色独立记忆、界面底色、本机字体与完整设置主题；液态玻璃边缘折射与方向反光，亦可选磨砂，浮层采样当前页面实际可见的背景与壁纸；分组件透明度、连续右栏与上下文玻璃、紧凑会话标签与单行状态读数；九张壁纸、本地图片或 4K／5K 循环视频及静态省电；支持键盘操作的模型思考强度控件与设置重置。
