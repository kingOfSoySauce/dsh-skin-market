description: 以《棕色尘埃2》圣剑骑士悠丝缇亚为主题的昼夜双模式皮肤：浅色是暖象牙底配圣金，深色是深夜暖黑配烛光金，全界面毛玻璃化、对话区透出立绘。背景库可换图、填绝对路径或 https 链接，侧栏透明度、帷幕深浅、圣光与星尘浓度都在面板里调，设置自动记忆。
