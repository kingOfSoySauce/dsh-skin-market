description: 6 个颜色角色（主色、背景、面板、输入框、文字、边框）可逐个取色或填 HEX，壁纸可上传图片/视频或粘贴直链，面板不透明度与毛玻璃强度、输入框和代码块各自的不透明度分开调。内置默认、午夜、海洋、森林、玫瑰、单色六套预设，配色能导出成 JSON 再导入。
