description: 右上角一枚绿色音符悬浮球，悬停展开 QQ 音乐面板：扫码登录后歌单持久保存，可浏览创建的歌单与「我喜欢」，点歌或播放全部，歌单缓存 24 小时。面板里有上一首/下一首、进度拖动、音量与静音；悬浮球能拖到任意位置并自动钳制在视口内，无版权或会员歌曲会自动跳过。
