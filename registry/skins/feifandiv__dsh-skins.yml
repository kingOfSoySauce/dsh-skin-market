  zh: 纸白与墨黑
  en: Paper & Ink
author: feifandiv
description: "两套全局配色在「设置 → 通用」里一键切换：纸白为象牙底 #faf9f5、米色侧栏、暖墨字与陶土强调色 #c96442；墨黑为炭黑 #181818、暖中性灰配同一枚陶土强调。每套重定向约 106 个设计变量，不替换组件、不改功能，切换后刷新与重启都保留，关闭即还原原生外观。"
