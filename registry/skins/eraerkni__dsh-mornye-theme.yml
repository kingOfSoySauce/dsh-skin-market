  zh: 莫宁主题
  en: Mornye Theme
author: eraerkni
description: 整套界面换成冷色调的「莫宁」：一段随包 20MB 的 mp4 当全屏动态壁纸（也可切留边），输入框和弹窗改成半透明磨砂，AI 回复旁有圆形头像。另有一只可拖动的桌宠，右键能选显示 DeepSeek 余额或 OpenCode Go 订阅额度、定时说一句自定义台词，还能加装莫宁人格与开屏画面。
