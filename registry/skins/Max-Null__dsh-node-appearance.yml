id: max.null.dsh.node.appearance
name:
  zh: 会话节点着色
  en: Session Node Colouring
author: Max-Null
description: 给会话面板里的节点按类别着色：工具调用、联网搜索、文件操作、子智能体、上下文压缩等各有一条可配置的 3px 色条与淡色底，折叠摘要条按类别取色，任意工具名还能单独覆盖颜色。另把「唤醒本轮」通知卡改成带轮次徽标的字段化展示、恢复被官方隐藏的系统提示词卡，并给「加载技能」行剥掉 XML 壳。
