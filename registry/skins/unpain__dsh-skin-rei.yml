description: 雾白、冰蓝、深海军蓝加极少量红色焦点的零号机医疗舱风格：欢迎页有完整凌波丽立绘、UNIT-00 同步环和玻璃效果，进入对话后立绘退到右侧并降低透明度与饱和度。亮色、暗色、设置弹窗、菜单、终端与消息状态分别设计，适配宽屏、窄屏和减少动态，角色素材内嵌不联网。
