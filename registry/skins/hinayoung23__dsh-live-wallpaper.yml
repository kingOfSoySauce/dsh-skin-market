id: hinayoung23.dsh.live.wallpaper
name:
  zh: 动态壁纸与主题中心
  en: Live Wallpaper & Theme Center
author: hinayoung23
description: 动态壁纸与页面主题中心：内置极光、星云、落日流光、霓虹网格四款离线程序化动画，也能贴 ShaderToy 作品 ID 或链接（不配 Key 直接走官方播放器，配 Key 后在本地 WebGL2 渲染），或用 HTTP(S) 视频、图片、网页和本地视频/GIF/图片当壁纸，可调暗度、模糊、界面遮罩透明度与视频速度。另有 5 套页面主题预设、5 种按钮形态与 4 种字体风格（90%–115% 字号），壁纸与主题独立开关；页面隐藏或系统要求「减少动态效果」时自动暂停，关闭主题或卸载即恢复原生外观。
