description: 在左侧栏加一个「视觉风格」入口，打开画廊页即可给整个应用换肤：像素街机（零圆角、等宽字体、高对比街机色）与极光絮语（近透明玻璃、不透明输入区、缓慢漂移的极光）。两种风格各有明暗两套色板并跟随系统明暗，选「恢复原生」即可整层移除。
