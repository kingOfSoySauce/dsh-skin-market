id: masterchiefm.dsh.realtime.tps.pet
name:
  zh: 实时速度悬浮窗
  en: Live Speed Overlay
author: Masterchiefm
description: 一个可拖动的悬浮窗，三种形态可选：桌宠（默认小肥鱼，另含月薪喵和矢量小机器人）、环形仪表、紧凑速度胶囊。实时读数把流式文本增量在 15 秒滚动窗口上积分估算 token，再用最近 8 个已完成调用的比值中位数校准，未校准时带 ≈；均速用上报输出 token 除以解码墙钟时间。右键切换形态，设置页可调均速口径、宠物形象和 0.6×–2× 窗口大小。
