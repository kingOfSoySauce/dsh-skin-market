id: galizhajidanbaofan.dsh.theme.notebook.paper
name:
  zh: 笔记本纸
  en: Notebook Paper
author: galizhajidanbaofan
description: 把桌面端铺成一张横线笔记本纸：纸色底、墨蓝横线跨整页对齐，侧栏右缘一条朱红竖线分栏。气泡和输入框是白色手绘勾线卡片，悬停画波浪线、选中圈朱红椭圆、完成打对勾。横线线距分宽、中、细三档，纸纹与头像可开关，头像可导入裁剪，共用 24–48px 尺寸滑块。
