description: 新拟态（Neumorphism）风格的 DSH 主题：冷灰画布、双向软阴影、明暗双模式；顶部功能刘海显示时间、峰谷倒计时、今日与本次会话费用、账户余额，并在 OpenCode Go 模型下自动切换成 5 时/本周/本月额度；33 项元素可以逐项调凸起与内凹；输入框下方标出当前 Git 分支与 AI 正在使用的 worktree。
