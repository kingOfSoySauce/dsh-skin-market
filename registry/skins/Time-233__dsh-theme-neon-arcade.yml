id: time.233.dsh.theme.neon.arcade
name:
  zh: 霓虹像素电玩
  en: NEON ARCADE
author: Time-233
description: 深紫黑底、电光青与品红描边的霓虹像素主题，配原创像素精灵、星空、城市剪影和像素鲸鱼，辉光、网格与单条 CRT 扫描线都能单独开关；内置三款可关的小游戏：像素空战（拖拽战机、自动射击、无限复活）、愤怒的小猪（拉弹弓）和霓虹切水果（滑动切割，切中炸弹整屏晃动 + 两次白闪 + YOU LOSE）。已在 Windows 上验证兼容 Harness 0.2.1-rc.1～rc.5，独立 Web 客户端不启用。
