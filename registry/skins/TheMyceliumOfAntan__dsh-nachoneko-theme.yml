description: "以 #A3D3FF 为锚点重着色整套 token：品牌色、主按钮、状态色、滚动条与气泡一起联动，另有略深的伴生蓝给链接。深色为主：body 铺全屏壁纸加蓝调渐变遮罩，侧栏 20px、输入框 24px、代码块 24px 毛玻璃；设置弹窗左下角贴一张角色装饰图，明暗各有一套遮罩。"
