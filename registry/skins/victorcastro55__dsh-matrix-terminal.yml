description: 磷光绿终端风：界面压成等宽、零圆角与扫描线（每三像素一条暗行），123 个色变量全部重映射成同一绿色系；输入框下新增命令提示行 harness@matrix:~$＋会话号前八位与闪烁方块光标。聊天区只留你问的与模型答的，工具调用、系统提示与重试等过程行移到右侧工作日志，另有一页「脉冲」用神经星座显示推理与工具工作。
