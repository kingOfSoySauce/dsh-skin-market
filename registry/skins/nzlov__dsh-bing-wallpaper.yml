description: 每天从 Bing 取一张壁纸铺作界面背景，并从图片提取主题色：提供 M3 Content、Rainbow、Vibrant 等十种取色风格，壁纸可见度 10%–100% 线性可调，另有模糊、毛玻璃、蓝色调、黑白与压暗滤镜。可在国内/国际 Bing 来源间切换、选 1080p/2K/4K，还能开 WebGL2 雨雪云雾天气窗景和选装 3D 深度视差。
