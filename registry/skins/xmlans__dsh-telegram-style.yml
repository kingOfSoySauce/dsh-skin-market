description: 把界面换成 Telegram 网页版的样子：墙纸上的浮动聊天列表、带小尾巴的消息气泡、48px 发送键的悬浮输入条，连菜单、Toast 与点击波纹也一并重做。经典、玻璃、粉色三套配色各有亮暗，输入条上沿还站着一只贴纸桌宠，会跟着思考、干活、等批准、出错与完成换动作。
