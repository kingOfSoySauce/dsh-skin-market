description: 一只原创像素鸡住在界面里：干活时搬砖、思考时托腮、等你回复时翘首，闲下来会按加权随机轮换打盹、踱步、啄米、抖毛、转球、投篮等十种待机动作。共 20 个动作、每行最多 8 帧，全部由代码程序化绘制；活跃度、位置与大小可调。
