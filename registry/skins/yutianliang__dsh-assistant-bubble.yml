id: yutianliang.dsh.assistant.bubble
name:
  zh: 助手回复气泡
  en: Assistant Reply Bubble
author: yutianliang
description: 给助手回复补上气泡底：圆角、可调不透明度，可选液态玻璃（白釉高光、模糊与落地阴影），工具条、过程折叠行、思考触发条和会话统计行会跟着用同一份材质。非会话页面（插件、自动化任务、技能中心、上下文洞察）也能单独铺底，系统开启「减少透明度」时自动去掉模糊与白釉。
