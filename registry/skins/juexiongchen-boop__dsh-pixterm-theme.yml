id: juexiongchen.boop.dsh.pixterm.theme
name:
  zh: 像素终端蓝
  en: Pixel Terminal Blue
author: juexiongchen-boop
description: "白底像素终端风：全局 VT323，主标题用 Press Start 2P，全屏细扫描线与淡蓝暗角；按钮和开关卡片统一 2px 蓝边加 4px 错位硬阴影，按下走 steps() 段落式位移。标题靠硬投影当图形锚点，引用块用 4px 蓝左边条，用户气泡是白卡加投影，整套只用 #4176E6 一种蓝。"
