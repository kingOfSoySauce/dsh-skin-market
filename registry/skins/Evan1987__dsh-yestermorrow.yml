  zh: 昨日之明日
  en: YESTERMORROW
author: Evan1987
description: 一个插件装三套复古未来主义皮肤——黄昏列车「以太工造」、霓虹雨夜「霓虹夜行」、太空港落日「落日海岸」，在设置里即时切换、不重载页面；三套共用 22 条标注出处的影视与哲学题词，点圆钮或按 R 换一句。
