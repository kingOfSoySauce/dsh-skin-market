id: ye.zinan.dsh.skin.im2005
name:
  zh: IM2005
  en: IM2005
author: YE-ZINAN
description: 把桌面端换成 2005 年即时通讯软件的样子：直角窗口、1px 硬边框、宋体、蓝色渐变标题条、好友分组式侧栏，还有一条「形象秀」右列。输入区工具条塞进余额、跨会话备注框、美式八球、20×20 扫雷、会无限生长的 Token 农场、六人桌德州扑克、后台任务和 1–180 分钟专注静音；皮肤分关/标准/浓烈三档实时切换。美术全部是原创 SVG，不含第三方图片、图标、商标或字体。
