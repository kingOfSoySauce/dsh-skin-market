id: jacobyixi.dsh.whale.ball
name:
  zh: 鲸尾悬浮球
  en: Whale-tail Ball
author: JacobYixi
description: 挂在 Windows 桌面上的鲸尾悬浮球：点一下展开嵌在球里的 WebView2 面板，接着当前会话聊天，拖到屏幕边缘会半隐、悬停可看余额。8 套皮肤都有浅色/深色两套配色，布纹用 CSS 经纬线画成、缩放到任何 DPI 都不糊，还支持自定义底色与强调色、跟随系统/浅色/深色三档切换。
