description: 美树沙耶香把会话状态翻译成十二张立绘：没事睡觉、跑命令拔刀、出错伤心几秒、成功高兴、整轮结束累倒，闲着每 14–30 秒擦一次剑；每态刚切换时冒一句独白气泡，部分台词配录音。十秒内连点会依次害羞、生气、气炸，按住拖动时被拎走，立绘直接硬切不淡入。
