description: 启动时全屏播放一段本地视频，播完淡出进入界面；把 MP4 放到固定路径或在设置里指定任意绝对路径即可换片，不用重装。支持跳过、静音降级、音量与画面适配；内置六幕动画在当前版本因挂载兼容问题暂时停用。
