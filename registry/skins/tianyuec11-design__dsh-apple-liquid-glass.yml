description: 苹果风液态玻璃材质：输入卡、侧栏控件、模型选择器和发送键各自独立开关玻璃效果，强度 0–100% 可调；输入框上沿有蓝色流光，打字时暂停。顶部深海蓝玻璃胶囊展开后显示会话标题、模式、时间与余额，开场是一颗可跳过的旋转粒子地球。
