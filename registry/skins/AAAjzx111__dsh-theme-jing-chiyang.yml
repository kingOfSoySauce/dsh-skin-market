description: 王者荣耀「镜 · 炽阳神光」主题：墨蓝与熔金配色的全屏夜穹（日轮、光冕、镜面裂纹），叠加会呼吸的光、约 19 秒一次的掠光与跟随鼠标的神光光晕；左下角「镜」徽记可在神光/静谧/关闭三档切换，选择记进 localStorage。启动时播约 5 秒的镜面破碎开场：整张主视觉被切成 56 片玻璃，显现、炸开、悬停后逆向重组。
