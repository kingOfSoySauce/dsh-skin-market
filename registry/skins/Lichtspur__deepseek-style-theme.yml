description: 参考 DeepSeek 官网首页视觉的玻璃主题：流体流动背景、带边缘折射的液态玻璃面板、玻璃侧栏与输入框、磨砂顶栏，以及运行中子代理进度面板，明暗双主题可切。还可开启按北京时间峰谷变色的 DSTT 模式（高峰鲜红、谷时蓝或绿），高峰窗口为工作日 9–12 点与 14–18 点。
