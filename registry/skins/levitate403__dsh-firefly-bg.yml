id: levitate403.dsh.firefly.bg
name:
  zh: 流萤背景
  en: Firefly Background
author: levitate403
description: 四张米游社流萤主题壁纸垫在界面后方，再撒一层 canvas 萤火虫（默认 26 只，可调到 64 只）。面板改成半透明玻璃：改主题令牌之外，还按颜色和尺寸探测外壳里写死的不透明容器打洞，晚渲染或切页新长出的容器靠延时补打和 MutationObserver 补齐。设置页可调遮罩浓度、背景模糊、萤火虫数量、面板通透度和缓慢漂移，深色是青黑夜色玻璃，浅色自动加白雾与 2.5px 模糊。
