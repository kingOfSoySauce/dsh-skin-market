description: 把界面换成 EVA 赛璐璐质感：初号机紫、零号机蓝、二号机红配荧光绿与警示黄，墨黑描边、方角、无模糊硬投影，全屏 CRT 扫描线可关；左栏会话行加 3px 状态轨（绿=运行中呼吸、黄=已完成、红=等你回复），右侧跳转条用荧光绿刻度，还能内嵌一张压暗底图。
