description: 打开界面时浅蓝线条汇聚成一条线描鲸鱼，向前游动带出一圈低对比波纹，随后中央淡入「deepseek HARNESS」字标，约 3 秒后淡出交还界面。Esc 或点击可跳过，设置里能关闭，并遵循系统的「减少动态」偏好。
