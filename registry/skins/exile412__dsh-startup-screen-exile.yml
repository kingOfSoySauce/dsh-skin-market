id: exile412.dsh.startup.screen.exile
name:
  zh: EXILE 启动界面
  en: EXILE Boot Screen
author: exile412
description: 启动动画分五幕：黑幕 EXILE 标识、过曝洗白、暖白档案底板、五步交互授权到色散揭幕，最底层是 1920×1080 的绿色二进制数字雨（8 秒循环，带 CRT 扫描线、噪点与拖影）。顶角与品牌文案写在 ~/.dsh/dsh-startup.json，改完刷新即生效；包名与原版 dsh-startup-screen 不同，两者可共存。
