id: talulra.dsh.wallpaper.glass
name:
  zh: 桌面壁纸透出
  en: Desktop Wallpaper Reveal
author: talulra
description: 把本机桌面壁纸透到界面后面：窗口变半透明，壁纸按屏幕位置像素对齐（窗口像桌面上挖的洞），跟随系统壁纸与填充方式实时更新，并按壁纸明暗自动调整遮罩；对话框、菜单面板与内嵌浏览器保持不透明。右下角可拖动 ◐ 胶囊控制壁纸显隐、三档透明度、0/8/16/28px 虚化、对齐开关与重置，设置存本机。
