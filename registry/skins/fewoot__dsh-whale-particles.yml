description: 把鲸鱼剪影铺成点阵界面背景：每颗粒子各自带平滑外力，鼠标靠近时躁动、移开又归位；自动模式让波沿 360° 扫过主体并做全屏呼吸。主体可换成导入的透明 PNG 照片，粒子双色渐变、发光强度、配色、帧率上限与渲染精度都能调。
