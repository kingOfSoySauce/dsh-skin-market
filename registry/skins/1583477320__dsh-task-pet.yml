id: 1583477320.dsh.task.pet
name:
  zh: 任务完成桌宠提醒
  en: Task-Done Pet Reminder
author: "1583477320"
description: 一轮任务结束（正常完成、报错或中止）时，大肥鱼在窗口右下角和屏幕右下角各弹一张手写风卡片，带开心、难过、歪头三种表情以及用时和两个操作按钮；待机每 3–7 秒随机眨眼，点她抖一下并冒爱心，13 秒自动收起、悬停时不收，屏幕右下角那张仅 Windows。
