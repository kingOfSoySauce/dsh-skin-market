description: 深空赤色主题：114 个色变量全部重映射成暗红体系（明暗两套），背景是一张 2560×1440 的程序化深空——星云、尘埃带、引力透镜黑洞、弧形地平线与小行星，由脚本从零绘制、不含外部素材；上面再叠 4 条互质周期撕裂光带、29 秒一轮的引力波、46 颗星尘、52/13px 双密度网格、四角 HUD 与每 7–14 秒一次的过载，右上角常驻 112×150 观测窗。
