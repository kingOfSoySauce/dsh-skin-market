id: ppy.web.dsh.audio.reactive
name:
  zh: 音频响应
  en: Audio Reactive
author: ppy-web
description: 把 audioMotion 频谱铺在对话内容之后、按整个视口居中，随流式朗读、音乐面板、设备声音、听写与麦克风五类声源起伏。设置页内置十余个命名预设与频谱声道、外观色彩调节，支持 JSON 导入导出；沉浸模式按 1–600 秒的触发延时淡入全屏遮罩（默认 15 秒，淡入淡出 360 毫秒），鼠标、按键或停播即淡出。
