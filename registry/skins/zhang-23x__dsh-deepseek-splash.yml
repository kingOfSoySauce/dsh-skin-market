id: zhang.23x.dsh.deepseek.splash
name:
  zh: DeepSeek 鲸鱼片头
  en: DeepSeek Whale Splash
author: zhang-23x
description: 同一段 DeepSeek 鲸鱼片头（描边自绘 → 三颗信号点点亮 → 填充与扫光成形 → DeepSeek 字标落款）接到桌面版自带的启动画面上：双击图标窗口一出现就播，播完鲸鱼保持点亮、信号点继续脉动当加载指示，桌面更新覆盖启动页后会自动装回（原页留备份）；也可以开启约 2.8 秒的界面全屏浮层，默认静音、可点击或按键跳过。
