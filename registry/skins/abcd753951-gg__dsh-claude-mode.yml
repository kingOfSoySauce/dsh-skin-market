id: abcd753951.gg.dsh.claude.mode
name:
  zh: Claude 模式
  en: Claude Mode
author: abcd753951-gg
description: Claude Code 风格的交互层：中性灰 + 陶土橙双主题（约 200 个令牌，跟随系统切换），输入区上方运行状态星与耗时，Ctrl/⌘+K 命令面板兼搜聊天记录，回合页脚按轮次在「烘焙 / 酿造 / 搅拌……」中轮换完成词，另有朗读助手回复、完成提示音、Alt+N 新建会话与快捷键一览。空输入框先给一条含目标、上下文、约束与验收方式的完整本地草稿，开启 AI 完善后再由当前模型改写一次并缓存。
