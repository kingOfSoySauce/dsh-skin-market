description: 把会话页换成角色舞台：Chat、Trajectory 之外多一个「剧场」视图，角色随真实工具事件行动，你的话变成漫画气泡、回复变成字幕，一轮结束时在台上摆出最终答案、真实统计和交付文件（可展开、复制、在侧栏或大图预览）。四幕由真实状态驱动，可导入 Codex Pet 精灵图，没有宠物时用内置占位角色，不额外调用模型。
