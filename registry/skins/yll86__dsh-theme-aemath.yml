description: "渐湖暮色里的樱花瓣配一点虚质空间幽光：浅色「樱花晨光」与深色「樱夜」两套配色覆盖整套设计令牌，主色紫罗兰玫粉（#963f86 / #c96f9e），按钮、链接、选中态、滚动条与代码块全部联动；对话区铺一层淡彩立绘背景，左下角挂 Q 版圆形徽章，favicon 与页面标题也换掉，样式、立绘、favicon 全部内联、不向外请求。"
