description: 透明、无边框、始终置顶的原生桌面窗口，由插件拉起、随 DSH 退出：显示思考、查找、修改、执行、验证、等待确认、完成和错误等真实任务状态，气泡里写项目、步骤、多任务和待办进度，还能显示 DeepSeek 余额并区分 API Key 与登录账户。支持拖动、摸头、戳身体、碰尾巴，可调大小、气泡、声音与减少动态，也能在页面右下角开一个轻量角色（默认关闭）。
