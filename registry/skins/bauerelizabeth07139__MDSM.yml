description: 把随包附带的 16:9 角色画铺成不可点击的整页背景，在 MDSM 设置页里调界面不透明度（25–100%）、壁纸模糊（0–24px）、遮罩浓度（0–90%，深色主题用黑、浅色用白）和壁纸位置。侧栏与会话首屏的标志可换成同一张方形头像，浏览器标签页图标也跟着换，保存后即时生效。
