id: penguinbing.dsh.alk.pet
name:
  zh: ALK 桌宠
  en: ALK Pet
author: penguinbing
description: 把任务状态做成桌面宠物：待机、思考、工作、等待确认、完成、出错各播对应动画，约 12 帧/秒。多会话时用状态圆点列出，每行最多 12 个，悬停切到对应任务；气泡显示会话标题和当前待办、步骤或工具参数，子 Agent 归到父会话。macOS、Windows 走原生置顶窗，启动失败自动回退页面内宠物。
