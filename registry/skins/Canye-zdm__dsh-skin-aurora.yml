id: canye.zdm.dsh.skin.aurora
name:
  zh: 极光
  en: Aurora
author: Canye-zdm
description: 近黑蓝夜空基底，两层极光光带以 12s 与 9s 不同周期错位流动，青蓝到紫再到绿渐变，顶部光晕与底部极光绿反光上下呼应；欢迎页标题做成极光渐变，代码块按极光配色重定关键字/字符串/注释，侧栏蓝紫渐变、卡片悬浮发光，明暗双主题并重映射语义色，系统开启减少动态效果时自动停掉光带。
