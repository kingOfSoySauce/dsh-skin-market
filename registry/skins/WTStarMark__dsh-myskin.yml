id: wtstarmark.dsh.myskin
name:
  zh: 可视化皮肤编辑器
  en: Visual Skin Editor
author: WTStarMark
description: 在真实界面上点选改外观：绘制模式可选中元素改样式、文字、字体、位置与缩放，面板可停靠左右；皮肤管理页提供深海/暖阳/粉黛三套预设、启用开关、皮肤库与 .dshframework 导入导出，还能一键让皮肤不接管背景以便和壁纸/玻璃插件共存。适配 0.1.7-rc.2、0.2.0-rc.1 与 0.2.0-rc.2，Web 与 Desktop 共用同一套客户端管线。
