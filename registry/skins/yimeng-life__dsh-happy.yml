name:
  zh: 十景动效背景
  en: Ten Animated Backdrops
author: yimeng-life
description: 给对话区加一层整屏动效背景，共十种场景：星空跃迁、代码雨、电路脉冲、华山论剑、小猫散步、小女生、飞机大战、赛车、飘雪、肥皂泡；每个回合随机换一个、回合内不变，Alt+T 可固定下一张；正文列用按列宽计算的横向纱保证可读，浅深主题自动换调色板与混合模式。
