description: 以《胜利女神：妮姬》桃乐丝与 Doro 梗形象为灵感的完整主题：亮暗跟随外观，桃乐丝壁纸、侧栏立绘、品牌字标、新会话图标、输入框玫瑰边框与花瓣动画，消息、代码块、工具调用和弹窗统一成玫瑰/莓紫语言。设置里有独立的 Doro Paradise 页面，可调侧栏遮罩与 48–320px 立绘高度、单独缩放 Doro，配置存 $DSH_HOME/doro-paradise-theme.json，重启保留。
