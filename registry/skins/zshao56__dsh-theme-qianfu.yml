description: 《潜伏》双配色主题：浅色「旧纸档案」是泛黄电报纸、铁胆墨水、墨绿西装与黄铜包角，深色「暗夜电台」是近黑墨绿、烟青台面、黄铜旋钮与压暗绛红，跟着外观设置切换。macOS 侧栏铺成纸色，底部挂一只原创「潜伏鲸」（礼帽、风衣领、红领带），上方站长金句卡每 5 分钟自动换一句，点击可立刻换。
