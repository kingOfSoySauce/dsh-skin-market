description: 六套开罗游戏配色（雪夜温泉、暖屋搬家、王国冒险、夏水乐园、新年百货、雪场缆车）每套 166 条令牌，宣传图作整窗背景、面板半透明浮在画上；右下角灯笼面板可切换主题与浅色 / 深色 / 跟随系统，调不透明度、取景位置和背景开关，也能一键回到内置主题。
