id: shirolin.dsh.theme.animal.island.ui
name:
  zh: 动森主题
  en: Animal Island UI
author: Shirolin
description: 动森风主题：日间是双层波点草坪、底部波浪与漂浮叶片，内容区铺半透明奶油纸；夜间换成深青夜空星点、冷色侧栏与暖棕纸面。侧栏顶部 24px 新会话入口扩成 216×60 渡岛船票，标题木牌、木纹选中项与手账感输入框气泡；设置「纸白/均衡/海岛」三档预设与 0.15–0.60 浓度滑杆，插画、纸纹、浅色 diff 与字体可单独关。
