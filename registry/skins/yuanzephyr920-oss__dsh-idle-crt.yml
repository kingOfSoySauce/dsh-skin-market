description: 没有会话在跑（busy=false）且页面内十分钟没人碰鼠标键盘时，盖上一块 CRT 板：辉光字、扫描线、38 秒一轮的循环反色扫掠，在窗口里点一下、按个键或触摸就淡出；鼠标移动默认不收起，只让整帧跟着指针偏 ±1.2% 做视差微动。逐帧全 GPU 合成，真机满 60fps、零运行时依赖，派生自 dsh-splash-crt 并把启动闪屏改成待机屏保。
