description: 把 DSH 主界面、DS Bot 与节点模式统一改成刀剑神域 Aincrad 风格的 HUD：深空底色、冷青全息描边、四角括号、扫描带与等宽数字。圆角归零，输入区做成带刻线的命令行窗，彩色位图统一压成青色，三套界面换用同一套配色与字体。
