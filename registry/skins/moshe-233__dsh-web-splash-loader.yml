id: moshe.233.dsh.web.splash.loader
name:
  zh: 液态玻璃加载屏
  en: Liquid Glass Splash Loader
author: moshe-233
description: 首帧就在页面最上层盖一层高斯模糊的液态玻璃遮罩，避免白屏和组件分批挂载的跳动；中间是一枚带脉冲光晕的深海鲸鱼图标，下方实时列出各插件的加载光圈、就绪对勾与耗时。全部就绪后弹性淡出，3.5 秒超时兜底；启动后在右下角留一枚状态胶囊，点开可看完整耗时并复制 JSON 报告。
