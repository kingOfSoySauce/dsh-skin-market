description: 《星际穿越》风格的实时 4K 黑洞铺在会话中栏：新会话时醒目、聊天时变淡，不覆盖侧栏，也不拦截输入、滚动与选择；每次启用或启动时通过官方主题接口把整个界面切为深色并保存一次，避免浅色底上黑洞几乎看不见。实际绘制分辨率始终为 3840×2160，动画源码独立开源。
