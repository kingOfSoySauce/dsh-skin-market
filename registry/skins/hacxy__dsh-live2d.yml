description: 右下角常驻一只 Live2D 看板娘：默认内置 Cubism 6 模型，也支持任意 .model.json（Cubism 2）与 .model3.json（Cubism 6）；模型下载时显示加载进度条，可拖到任意位置。模型地址、宽高、透明度、层级、锚定边与间距、缩放、音量、日志级别、总开关与拖拽共 13 项都在「设置 → Live2D」里调整，保存即生效，面板配色跟随明暗。
