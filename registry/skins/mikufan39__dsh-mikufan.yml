description: 侧栏「MAGICAL MIRAI」控制面板里的八项功能：删除会话（标记后下次启动时删除，子代理会话一并处理）、本地长期记忆、局域网访问反向代理（默认 3090 端口）、Skills 管理（自带 skill-creator）、全局 AGENTS.md 编辑、MCP 服务器管理，以及开启后六秒倒计时的一键重启。另附每次加载页面时播放的光点汇聚启动动画。
