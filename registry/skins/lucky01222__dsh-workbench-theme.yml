description: 冷紫与纸白的明暗配色，把灰原哀的立绘、漫画分镜和 APTX 标志放进欢迎区、页头与侧栏，装饰不挡点击。设置 → 通用 → 外观里可切换主题素材、展示强度、工作台标志与减少动态效果，选「无装饰」只留配色和静态字标。
