description: 冷启动时播约 12.4 秒的核心终端序列：终端启动、异常回滚到 SLOT_A、本机体检、550W 铭牌翻转 180° 露出 MOSS 再揭幕，点按或按键可跳过。套装还带深红与青绿两套同款主题、全屏访问门口令和开机体检页，体检显示版本、插件清单、定时任务、最近会话与磁盘内存数据。
