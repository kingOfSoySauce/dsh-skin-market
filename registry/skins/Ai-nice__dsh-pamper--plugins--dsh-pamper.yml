description: 独立桌宠插件：宠爱页面分角色、桌宠配置、发现三栏，可同时显示多只宠物；每只都能开关、改名、调尺寸和角落位置。页面右下角有陪伴浮层，Windows 上还能开无边框透明桌面窗；透明 WebM 动作在发现页按需下载，数据写在 DSH_HOME/pamper。
