description: 全屏 H.264 1080p 启动视频：6 条字幕按 video.currentTime 与配音逐句对齐，Canvas 星尘粒子与四角光标、扫描线、右侧数据流的 HUD 边框叠在视频上；Windows 下还能隐藏原生最小化 / 最大化 / 关闭按钮而无需全屏，设置页可关动画或一键重播。视频 1.6 秒未起播切墙钟、17 秒硬兜底放行，任何一步失败都不锁死界面。
