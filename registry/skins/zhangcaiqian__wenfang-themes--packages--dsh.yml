id: zhangcaiqian.wenfang.themes
name:
  zh: 文房六色
  en: Wenfang Six Palettes
author: zhangcaiqian
description: 一个插件注册六套文房色板：玄墨、玄墨·暗、宣纸、宣纸·暗、沧海、青瓷，每套从五个手调颜色展开出约 30 个 --dsw-* 令牌（表面、描边、文字、diff、选区等）。在设置 → 插件市场 → 主题 → 已注册色板里切换，立即生效并在刷新后保留，首次安装会落到最接近的明暗变体。
