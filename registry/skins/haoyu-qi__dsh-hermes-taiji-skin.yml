description: 纸墨金配色的 DSH 主题，月华白与玄夜两套色板跟随系统外观。每次启动或刷新先播五秒开场：中央先天八卦盘转动，四向行书依次扫入，可点击跳过；回车发送时闪一记太极。侧栏有太极印、占卜令牌与今日一签，另带紫微命盘对话框与每日神明画像。
