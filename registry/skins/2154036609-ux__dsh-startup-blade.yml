id: 2154036609.ux.dsh.startup.blade
name:
  zh: 拔刀启动动画
  en: Blade-Draw Splash
author: 2154036609-ux
description: 约 2.6 秒的纯装饰启动动画：黑幕落下、鞘口一点冷光，刀身自右下向左上拔出，屏幕轻震并把黑幕真正「划开」——切口里透出的是真实界面；随后白闪、残留一线刀锋、黑幕溶解与火花受重力沉降，默认就定格在你当前的界面 / 壁纸上。也可在 DSH_HOME 放一张 frame.png 定格成一张画，或放 3–5 秒片段切到影片模式，点一下 / 按任意键跳过。
