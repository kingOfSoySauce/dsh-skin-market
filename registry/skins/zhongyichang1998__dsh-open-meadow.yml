description: 动态海边主题：手绘海景里有漂移云层、局部海面纹理与移动浪花，三簇前景花草随风摆动；静风、微风、强风控制花草摆幅、水面波动、浪花速度与云速，清晨/正午/日落三个时段与节能/均衡/精细三档画质。背景可见度默认 70%（10%–95% 可调），输入框、代码与菜单保留阅读底色，设置嵌在「设置 → 通用设置」里。
