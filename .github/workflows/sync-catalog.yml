name: Sync generated skin catalog

on:
  push:
    branches: [main]
    paths:
      - 'registry/skins/**'
      - 'registry/skin.schema.json'
      - 'scripts/build-registry.mjs'
      - 'scripts/hydrate-submission.mjs'
      - 'scripts/screenshot-refs.mjs'
      - 'scripts/media.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-generated-skin-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run registry

      - name: Commit generated catalog when it changed
        run: |
          if git diff --quiet -- data/catalog.json registry/skins; then
            echo 'catalog and registry are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json registry/skins
          git commit -m 'chore(registry): regenerate catalog'
          git push
