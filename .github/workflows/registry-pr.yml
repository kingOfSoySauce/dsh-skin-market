name: Validate registry submission

on:
  pull_request:
    paths:
      - 'registry/skins/**'
      - 'registry/skin.schema.json'
      - 'registry/submission-contract.json'
      - 'data/catalog.json'
      - 'data/catalog-copy.json'
      - 'scripts/build-registry.mjs'
      - 'scripts/catalog-copy.mjs'
      - 'scripts/entry-update-guard.mjs'
      - 'scripts/hydrate-submission.mjs'
      - 'scripts/screenshot-refs.mjs'
      - 'scripts/media.mjs'
      - 'scripts/build-media.mjs'
      - 'scripts/submission-contract.mjs'
      - 'scripts/version-range.mjs'
      - 'src/client/submission.ts'
      - 'tests/submission.spec.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate registry entries without writing generated files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run registry:check

      - name: Check the submission contract and README stay in sync
        run: npm run contract:check

      # A rowId that differs from the pinned patch's loader row passes the
      # schema check but makes the market refuse activation later, so verify it
      # against the pinned commit while the submission is still in review.
      - name: Check loader row ids against the pinned patches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-loader-identity.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Run submission prompt smoke tests
        run: npm run smoke:submission

      # One guard for both community paths: a new thin entry, or an update to an
      # entry the author already owns (optionally with its own display copy).
      # It diffs from the PR merge-base so a branch that is behind main only
      # reports its own changes; data/catalog.json is always rejected.
      - name: Guard community entry updates
        if: github.event.pull_request.head.repo.full_name != github.repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/entry-update-guard.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
